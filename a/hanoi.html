<header class="top">
  <h1>《数据结构》互动课件</h1>
  <span class="sub">教材：《数据结构（C语言版）第3版》（严蔚敏 · 李冬梅 · 吴伟民） ｜ 操作：← → 单步，空格 自动播放/暂停，可改输入后自动重新演示</span>
  <span class="hbtns">
    <button id="btnCatalog" title="按章节浏览全部动画，一键直达或复制链接">☰ 目录</button>
    <button id="btnProj" title="投影模式：更大字号，适合课堂投屏">🖥 投影</button>

</header>
<nav class="chapters" id="chapters"></nav>
<div class="modbar" id="modbar"></div>
<main>
  <section class="card">
    <div class="modtitle"><b id="modname"></b><span id="modnote2" class="modnote"></span></div>
    <div id="guide" class="guidebox" hidden></div>
    <div id="stage"></div>
    <div class="controls">
      <div id="inputs" class="inputs"></div>
      <button id="btnReset">⟲ 重置</button>
      <button id="btnPrev">◀ 上一步</button>
      <button id="btnNext">下一步 ▶</button>
      <button id="btnPlay">▶ 自动播放</button>
      <button id="btnShot" title="把当前画面导出为 PNG 图片（可插入课件/试卷）">📷 截图</button>
      <button id="btnLink" title="复制当前页面链接（可直达本模块本帧）">🔗 链接</button>
      <button id="btnGuide" title="显示/隐藏使用引导">? 引导</button>
      <label class="inp">速度
        <select id="speed">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
      </label>
      <input type="range" id="seek" min="0" max="0" value="0" title="拖动跳转到任意一步">
      <span id="pos" class="pos"></span>
    </div>
  </section>
  <aside class="side">
    <div class="sidehead">教材伪代码（当前执行行高亮）</div>
    <div class="codebox"><pre id="code"></pre></div>
    <div class="sidehead">状态面板</div>
    <table class="panel" id="panel"></table>
    <div id="msg" class="msg"></div>
  </aside>
</main>

    '    else {',
    '        hanoi(n - 1, A, C, B);               // ① 上面n-1个盘 A→B（借助C）',

  DSC.reg({
    id: 'hanoi', ch: 3, name: '⑤ 递归调用栈：汉诺塔',
    note: '教材 3.4 栈与递归（递归工作栈）',
    guide: [
      '右侧递归工作栈与左侧圆盘移动完全同步：压栈=展开一层计划，弹栈=该层完成',
      '每个移动帧都标注由哪个栈帧的哪一步触发',
      '把 n 调到 4、5，观察步数按 2^n − 1 指数增长',
      '最大栈深 = n → 空间 O(n)；步数 2^n − 1 → 时间 O(2^n)'
    ],
    inputs: [
      { key: 'n', label: '盘子数 n', type: 'number', value: 3, min: 1, max: 5 }
    ],
    run: function (v) {
      var n = Math.floor(+v.n);
      if (!(n >= 1 && n <= 5)) throw new Error('盘子数 n 取 1～5（5 已经要 31 步）');
      var frames = [];
      var pegs = { A: [], B: [], C: [] };

      var stack = [], step = 0;

        o = o || {};

      var depthMax = 0;

        var disc = pegs[from].pop();
        pegs[to].push(disc);
        step++;
        var owner = stack[stack.length - 1] || '';
        F([m === 1 ? 2 : 5], '第 ' + step + ' 步：move(' + m + ', ' + from + ', ' + to + ') —— 盘 ' + disc + ' 从 ' + from + ' 移到 ' + to + '。（由当前栈顶 ' + owner + ' 的' + (m === 1 ? '递归出口' : '第②步 move') + '触发）',
          { 递归调用栈: stack.join(' ｜ '), 已移动: step + ' / ' + (Math.pow(2, n) - 1) + ' 步' },
          snap({ last: { disc: disc, from: from, to: to }, phase: 'move' }));

      function hanoi(k, from, via, to) {

        if (stack.length > depthMax) depthMax = stack.length;
        F(0, '调用 hanoi(' + k + ', ' + from + ', ' + via + ', ' + to + ')：系统把工作记录（参数、返回地址）压入【递归工作栈】。当前栈深 ' + stack.length + '。',
          { 递归调用栈: stack.join(' ｜ '), 已移动: step + ' 步' }, snap({ phase: 'call' }));
        if (k === 1) {
          move(1, from, to);

          hanoi(k - 1, from, to, via);   // A→B 借助C：参数顺序 (from, to, via) 中 to=B via=C

          { 递归调用栈: stack.join(' ｜ ') || '（空）', 已移动: step + ' 步' }, snap({ phase: 'ret' }));

        { 递归调用栈: '（空）', 已移动: '0 步', 预测总步数: '2^' + n + ' − 1 = ' + (Math.pow(2, n) - 1) },
