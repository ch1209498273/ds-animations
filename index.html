<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>《数据结构》互动课件</title>
<style>:root{
  --bg:#f5f7fa; --panel:#fff; --ink:#1f2933; --muted:#5f6b76;
  --blue:#2563eb; --line:#d9e2ec; --code-bg:#0f172a; --code-ink:#e2e8f0;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  display:flex;flex-direction:column;
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;}
header.top{background:#0f2c5c;color:#fff;padding:8px 18px 6px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;flex:none}
header.top h1{font-size:18px;margin:0;font-weight:600;white-space:nowrap}
header.top .sub{font-size:11.5px;opacity:.78}
header.top .ver{font-size:10.5px;opacity:.85;border:1px solid rgba(255,255,255,.35);padding:1px 9px;border-radius:10px;white-space:nowrap}
nav.chapters{display:flex;gap:8px;background:#0f2c5c;padding:0 18px 9px;flex-wrap:wrap;flex:none}
nav.chapters button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;
  padding:4px 14px;border-radius:6px;font-size:13.5px;cursor:pointer}
nav.chapters button.active{background:#fff;color:#0f2c5c;font-weight:600}
.modbar{display:flex;gap:8px;padding:8px 18px;background:#fff;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap;flex:none}
.modbar .pill{border:1px solid var(--line);background:#f8fafc;border-radius:999px;padding:5px 14px;font-size:13.5px;cursor:pointer;color:var(--ink)}
.modbar .pill.active{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.modnote{font-size:12px;color:var(--muted);margin-left:auto}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(560px,1.3fr) minmax(360px,410px);
  gap:12px;padding:10px 18px;overflow:hidden;align-items:stretch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:0}
main .card{display:flex;flex-direction:column}
.modtitle{display:flex;align-items:baseline;gap:10px;padding:8px 14px 4px;flex:none}
.modtitle b{font-size:15.5px}
.modtitle .modnote{margin-left:auto}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px}
#stage svg{width:100%;height:100%;display:block}
.controls{display:flex;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);flex-wrap:wrap;background:#fbfcfe;flex:none}
.controls button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 11px;font-size:13.5px;cursor:pointer;color:var(--ink);white-space:nowrap}
.controls button:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.controls button:disabled{opacity:.4;cursor:default}
.inputs{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.inp{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.inp input[type=text]{width:170px}
.inp input[type=number]{width:64px}
.inp input,.inp select{border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:13.5px}
.pos{font-size:12.5px;color:var(--muted);white-space:nowrap}
.controls input[type=range]{flex:1;min-width:100px;max-width:200px;accent-color:var(--blue);cursor:pointer}
.side{display:flex;flex-direction:column;gap:6px;height:100%;min-height:0;overflow:hidden}
.sidehead{font-size:12.5px;color:var(--muted);font-weight:600;flex:none}
.codebox{background:var(--code-bg);border-radius:10px;padding:8px 0;overflow:auto;flex:1 1 auto;min-height:90px}
.codebox pre{margin:0;font-family:Consolas,"Courier New",monospace;font-size:12.5px;line-height:1.5;color:var(--code-ink)}
.codebox .cl{display:block;padding:0 12px;white-space:pre-wrap;word-break:break-all}
.codebox .cl.on{background:rgba(37,99,235,.42);color:#fff;box-shadow:inset 3px 0 0 #60a5fa}
table.panel{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;font-size:13px;flex:none;display:block;max-height:32%;overflow:auto}
table.panel td{border-top:1px solid #eef2f7;padding:5px 11px}
table.panel tr:first-child td{border-top:none}
table.panel td:first-child{color:var(--muted);width:36%}
.msg{background:var(--amber-bg);border:1px solid #f5d48f;border-radius:10px;padding:8px 13px;font-size:13.5px;line-height:1.6;flex:none;max-height:22%;overflow:auto}
.hl{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
/* 头部功能按钮 */
.hbtns{display:inline-flex;gap:6px;margin-left:auto}
.hbtns button{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:6px;
  padding:3px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.hbtns button:hover,.hbtns button.on{background:rgba(255,255,255,.18)}
/* 练习模式：解说栏遮罩 */
.msg.quizcover{cursor:pointer;background:#eef4ff;border-color:#b9d0f5}
.msg .quizhint{color:#1e4fa3;font-weight:600}
/* 总目录覆盖层 */
#catalog{position:fixed;inset:0;background:rgba(15,28,50,.55);z-index:60;overflow:auto;padding:26px 18px}
#catalog .ovhead{max-width:1060px;margin:0 auto 10px;background:#fff;border-radius:12px;padding:12px 18px;
  display:flex;align-items:baseline;gap:12px;font-size:16px}
#catalog .ovhead span{color:#5f6b76;font-size:13px}
#catalog .ovhead button{margin-left:auto;border:1px solid var(--line);background:#f8fafc;border-radius:6px;
  padding:4px 12px;cursor:pointer;font-size:13px}
#catalog .ovch{max-width:1060px;margin:14px auto 6px;color:#0f2c5c;font-weight:700;font-size:14.5px}
#catalog .ovch i{font-weight:400;color:#5f6b76;font-size:12.5px;margin-left:8px}
#catalog .ovgrid{max-width:1060px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
#catalog .ovcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:5px}
#catalog .ovcard b{font-size:13.5px;color:var(--ink)}
#catalog .ovcard span{font-size:11.5px;color:#5f6b76;min-height:16px}
#catalog .ovbtns{display:flex;gap:6px;margin-top:2px}
#catalog .ovbtns button{border:1px solid var(--line);background:#f8fafc;border-radius:6px;padding:3px 10px;
  font-size:12px;cursor:pointer;color:var(--ink)}
#catalog .ovbtns button:hover{border-color:var(--blue);color:var(--blue)}
/* 二维码浮层 */
#qrbox{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:14px;
  padding:14px 18px;z-index:70;box-shadow:0 10px 40px rgba(15,28,50,.35)}
#qrbox .qrt{display:flex;align-items:baseline;gap:10px;font-size:14px;margin-bottom:8px}
#qrbox .qrt button{margin-left:auto;border:1px solid var(--line);background:#f8fafc;border-radius:6px;padding:2px 10px;cursor:pointer}
#qrbox .qrb svg{width:200px;height:200px;display:block}
/* 投影模式：全局放大 */
body.proj{font-size:17px}
body.proj header.top h1{font-size:24px}
body.proj header.top .sub{font-size:14px}
body.proj nav.chapters button{font-size:16px;padding:6px 18px}
body.proj .modbar .pill{font-size:15.5px;padding:7px 18px}
body.proj .modtitle b{font-size:19px}
body.proj .controls button{font-size:15.5px;padding:8px 14px}
body.proj .codebox pre{font-size:14.5px}
body.proj table.panel{font-size:15px}
body.proj .msg{font-size:16px}
@media (max-width:1024px){
  body{overflow:auto;height:auto}
  main{grid-template-columns:1fr;overflow:visible}
  .side{height:auto}
  .codebox{max-height:46vh}
  table.panel{max-height:none}
}
</style>
</head>
<body>
<header class="top">
  <h1>《数据结构》互动课件</h1>
  <span class="sub">教材：《数据结构（C语言版）第3版》（严蔚敏 · 李冬梅 · 吴伟民） ｜ 操作：← → 单步，空格 自动播放/暂停，可改输入后自动重新演示</span>
  <span class="hbtns">
    <button id="btnCatalog" title="按章节浏览全部动画，一键直达或复制链接">☰ 目录</button>
    <button id="btnProj" title="投影模式：更大字号，适合课堂投屏">🖥 投影</button>
  </span>
  <span class="ver">v2.1 · 构建 2026-09-19 11:37</span>
</header>
<nav class="chapters" id="chapters"></nav>
<div class="modbar" id="modbar"></div>
<main>
  <section class="card">
    <div class="modtitle"><b id="modname"></b><span id="modnote2" class="modnote"></span></div>
    <div id="guide" class="guidebox" hidden></div>
    <div id="stage"></div>
    <div class="controls">
      <div id="inputs" class="inputs"></div>
      <button id="btnReset">⟲ 重置</button>
      <button id="btnPrev">◀ 上一步</button>
      <button id="btnNext">下一步 ▶</button>
      <button id="btnPlay">▶ 自动播放</button>
      <button id="btnShot" title="把当前画面导出为 PNG 图片（可插入课件/试卷）">📷 截图</button>
      <button id="btnHandout" title="取当前动画 6 个关键帧拼成讲义 PNG（可打印/插入PPT）">🖨 讲义</button>
      <button id="btnLink" title="复制当前页面链接（可直达本模块本帧）">🔗 链接</button>
      <button id="btnPractice" title="练习模式：隐藏解说，先预测下一步再揭示">🎯 练习</button>
      <button id="btnGuide" title="显示/隐藏使用引导">? 引导</button>
      <label class="inp">速度
        <select id="speed">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
      </label>
      <input type="range" id="seek" min="0" max="0" value="0" title="拖动跳转到任意一步">
      <span id="pos" class="pos"></span>
    </div>
  </section>
  <aside class="side">
    <div class="sidehead">教材伪代码（当前执行行高亮）</div>
    <div class="codebox"><pre id="code"></pre></div>
    <div class="sidehead">状态面板</div>
    <table class="panel" id="panel"></table>
    <div id="msg" class="msg"></div>
  </aside>
</main>
<script>
/* =============================================================
 * 《数据结构》互动课件 · 播放引擎（帧驱动）
 * 帧模型：算法逻辑层产出帧序列（纯数据快照），渲染层消费快照；
 * 单步/回退/自动播放都只是移动帧指针，保证逻辑与展示一致。
 * ============================================================= */
(function () {
  var DSC = window.DSC = window.DSC || {};
  DSC.mods = [];
  DSC.reg = function (m) { DSC.mods.push(m); };

  /* ---------- SVG 小工具 ---------- */
  var C = DSC.C = {
    ink: '#1f2933', muted: '#5f6b76',
    blue: '#2563eb', blueBg: '#dbeafe',
    green: '#16a34a', greenBg: '#dcfce7',
    amber: '#d97706', amberBg: '#fef3c7',
    red: '#dc2626', redBg: '#fee2e2',
    grey: '#94a3b8', greyBg: '#f1f5f9', line: '#cbd5e1'
  };
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  DSC.h = {
    C: C, esc: esc,
    /* 逗号/空格分隔的整数串 → 数组（各章模块通用） */
    parse: function (s) {
      return String(s).split(/[,，\s]+/).filter(function (x) { return x !== ''; })
        .map(Number).filter(function (x) { return !isNaN(x); });
    },
    svg: function (w, hh, inner) {
      return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + hh + '">' + inner + '</svg>';
    },
    txt: function (x, y, s, o) {
      o = o || {};
      return '<text x="' + x + '" y="' + y + '" font-size="' + (o.size || 15) + '" fill="' + (o.fill || C.ink) +
        '" text-anchor="' + (o.anchor || 'middle') + '"' + (o.w ? ' font-weight="' + o.w + '"' : '') +
        (o.family ? ' font-family="' + o.family + '"' : '') + '>' + esc(s) + '</text>';
    },
    rect: function (x, y, w, hh, o) {
      o = o || {};
      return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + hh + '" rx="' + (o.rx == null ? 6 : o.rx) +
        '" fill="' + (o.fill || '#fff') + '" stroke="' + (o.stroke || C.grey) + '" stroke-width="' + (o.sw == null ? 1.5 : o.sw) + '"' +
        (o.dash ? ' stroke-dasharray="' + o.dash + '"' : '') + '/>';
    },
    circle: function (cx, cy, r, o) {
      o = o || {};
      return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + (o.fill || '#fff') +
        '" stroke="' + (o.stroke || C.grey) + '" stroke-width="' + (o.sw == null ? 2 : o.sw) + '"' +
        (o.dash ? ' stroke-dasharray="' + o.dash + '"' : '') + '/>';
    },
    line: function (x1, y1, x2, y2, o) {
      o = o || {};
      return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + (o.stroke || C.grey) +
        '" stroke-width="' + (o.sw == null ? 2 : o.sw) + '"' + (o.dash ? ' stroke-dasharray="' + o.dash + '"' : '') + '/>';
    },
    arrow: function (x1, y1, x2, y2, o) {
      o = o || {};
      var head = o.head == null ? 8 : o.head;
      var a = Math.atan2(y2 - y1, x2 - x1);
      var bx = x2 - head * Math.cos(a), by = y2 - head * Math.sin(a);
      var s = head * 0.5;
      var pts = x2 + ',' + y2 + ' ' + (bx + s * Math.sin(a)) + ',' + (by - s * Math.cos(a)) + ' ' +
        (bx - s * Math.sin(a)) + ',' + (by + s * Math.cos(a));
      return this.line(x1, y1, bx, by, o) + '<polygon points="' + pts + '" fill="' + (o.stroke || C.grey) + '"/>';
    },
    /* 二次曲线箭头（用于绕行/弯曲的边） */
    curve: function (x1, y1, cx, cy, x2, y2, o) {
      o = o || {};
      var head = o.head == null ? 8 : o.head;
      var a = Math.atan2(y2 - cy, x2 - cx);
      var bx = x2 - head * Math.cos(a), by = y2 - head * Math.sin(a);
      var s = head * 0.5;
      var pts = x2 + ',' + y2 + ' ' + (bx + s * Math.sin(a)) + ',' + (by - s * Math.cos(a)) + ' ' +
        (bx - s * Math.sin(a)) + ',' + (by + s * Math.cos(a));
      return '<path d="M' + x1 + ',' + y1 + ' Q' + cx + ',' + cy + ' ' + bx + ',' + by + '" fill="none" stroke="' +
        (o.stroke || C.grey) + '" stroke-width="' + (o.sw == null ? 2 : o.sw) + '"' +
        (o.dash ? ' stroke-dasharray="' + o.dash + '"' : '') + '/>' +
        '<polygon points="' + pts + '" fill="' + (o.stroke || C.grey) + '"/>';
    }
  };

  /* ---------- 章节信息（对齐严蔚敏《数据结构（C语言版）》经典八章体系） ---------- */
  var CH = {
    1: { name: '第1章 绪论', note: '算法与时间复杂度分析' },
    2: { name: '第2章 线性表', note: '顺序存储与链式存储' },
    3: { name: '第3章 栈和队列', note: '操作受限的线性表及其应用' },
    4: { name: '第4章 串和数组', note: '模式匹配与矩阵压缩存储' },
    5: { name: '第5章 树和二叉树', note: '遍历、线索与哈夫曼树' },
    6: { name: '第6章 图', note: '遍历与四大应用' },
    7: { name: '第7章 查找', note: '静态/动态查找与散列表' },
    8: { name: '第8章 排序', note: '八大内部排序' }
  };

  /* ---------- 模块自动编号：按注册顺序显示 ①②③…，模块名无需手写圈号 ---------- */
  var CIRCLED = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳㉑㉒㉓㉔㉕㉖㉗㉘㉙㉚㉛㉜㉝㉞㉟㊱㊲㊳㊴㊵㊶㊷㊸㊹㊺';
  var CIRC_RE = /^[①-⑳㉑-㉟㊱-㊺]+\s*/;
  function autoNumber() {
    DSC.mods.forEach(function (m, i) {
      m.disp = (CIRCLED[i] || (i + 1) + '.') + ' ' + m.name.replace(CIRC_RE, '');
    });
  }

  /* ---------- 状态 ---------- */
  var cur = null, frames = [], code = [], idx = 0, timer = null, speed = 1;

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

  function parseHash() {
    if (!location.hash || location.hash.length < 2) return null;
    var o = {};
    location.hash.slice(1).split('&').forEach(function (p) {
      var kv = p.split('=');
      if (kv[0]) o[kv[0]] = decodeURIComponent(kv[1] || '');
    });
    return o;
  }

  function init() {
    autoNumber();
    var chapters = [];
    DSC.mods.forEach(function (m) { if (chapters.indexOf(m.ch) < 0) chapters.push(m.ch); });
    chapters.sort(function (a, b) { return a - b; });
    var nav = $('chapters');
    chapters.forEach(function (c) {
      var b = el('button', null, CH[c] ? CH[c].name : ('第' + c + '章'));
      b.dataset.ch = c;
      b.onclick = function () { selectChapter(c); };
      nav.appendChild(b);
    });
    bindControls();
    document.addEventListener('keydown', keys);
    applyHash(parseHash());
  }

  function applyHash(h) {
    var target = h && h.m ? DSC.mods.filter(function (x) { return x.id === h.m; })[0] : null;
    selectChapter(target ? target.ch : DSC.mods.length ? DSC.mods[0].ch : 2);
    if (target) {
      var pill = document.querySelector('#modbar .pill[data-id="' + target.id + '"]');
      selectModule(target, pill);
      target.inputs.forEach(function (sp) {
        var c = $('inp_' + sp.key);
        if (c && h[sp.key] != null) {
          if (sp.type === 'checkbox') c.checked = (h[sp.key] === '1' || h[sp.key] === 'true');
          else c.value = h[sp.key];
        }
      });
      build();
      if (h.f) { idx = Math.max(0, Math.min(frames.length - 1, +h.f || 0)); draw(); }
    }
  }

  function selectChapter(c) {
    var bs = document.querySelectorAll('#chapters button');
    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('active', +bs[i].dataset.ch === c);
    var bar = $('modbar'); bar.innerHTML = '';
    DSC.mods.filter(function (m) { return m.ch === c; }).forEach(function (m) {
      var p = el('button', 'pill', m.disp || m.name);
      p.dataset.id = m.id;
      p.onclick = function () { selectModule(m, p); };
      bar.appendChild(p);
    });
    bar.appendChild(el('span', 'modnote', CH[c] ? CH[c].note : ''));
    var first = DSC.mods.filter(function (m) { return m.ch === c; })[0];
    if (first) selectModule(first, bar.querySelector('.pill'));
  }

  function selectModule(m, pill) {
    if (pill) {
      var ps = document.querySelectorAll('#modbar .pill');
      for (var i = 0; i < ps.length; i++) ps[i].classList.toggle('active', ps[i] === pill);
    }
    cur = m; stop();
    var box = $('inputs'); box.innerHTML = '';
    (m.inputs || []).forEach(function (sp) {
      var wrap = el('label', 'inp');
      var ctl;
      if (sp.type === 'select') {
        ctl = document.createElement('select');
        sp.options.forEach(function (op) {
          var o = document.createElement('option'); o.value = op[0]; o.textContent = op[1]; ctl.appendChild(o);
        });
        ctl.value = sp.value;
      } else if (sp.type === 'checkbox') {
        ctl = document.createElement('input'); ctl.type = 'checkbox'; ctl.checked = !!sp.value;
      } else {
        ctl = document.createElement('input'); ctl.type = sp.type || 'text';
        if (sp.min != null) ctl.min = sp.min;
        if (sp.max != null) ctl.max = sp.max;
        ctl.value = sp.value;
      }
      ctl.id = 'inp_' + sp.key;
      wrap.appendChild(ctl);
      wrap.insertBefore(document.createTextNode(sp.label), ctl);
      ctl.addEventListener('change', build);
      box.appendChild(wrap);
    });
    $('modname').textContent = m.disp || m.name;
    $('modnote2').textContent = m.note || '';
    renderGuide(false);
    build();
  }

  function values() {
    var v = {};
    cur.inputs.forEach(function (s) {
      var c = $('inp_' + s.key);
      v[s.key] = s.type === 'checkbox' ? c.checked : (s.type === 'number' ? +c.value : c.value);
    });
    return v;
  }

  function build() {
    stop();
    var res;
    try { res = cur.run(values()); }
    catch (err) {
      $('msg').innerHTML = '<b>输入有误：</b>' + esc(err.message);
      $('stage').innerHTML = ''; $('code').innerHTML = ''; $('panel').innerHTML = '';
      frames = []; idx = 0; updateProgress(); return;
    }
    frames = res.frames; code = res.code; idx = 0;
    draw();
  }

  function draw() {
    var f = frames[idx];
    if (!f) { $('stage').innerHTML = ''; $('code').innerHTML = ''; $('panel').innerHTML = ''; $('msg').innerHTML = ''; updateProgress(); return; }
    $('stage').innerHTML = cur.render(f.snap);
    var lines = code.map(function (t, i) {
      var on = f.line && f.line.indexOf(i) >= 0;
      return '<span class="cl' + (on ? ' on' : '') + '">' + esc(t) + '</span>';
    });
    $('code').innerHTML = lines.join('\n');
    var p = f.panel || {}, keysArr = Object.keys(p);
    $('panel').innerHTML = keysArr.map(function (k) {
      return '<tr><td>' + esc(k) + '</td><td>' + p[k] + '</td></tr>';
    }).join('');
    $('msg').innerHTML = f.msg || '';
    if (practice && revealIdx !== idx) {
      /* 练习模式：解说与状态面板同时遮住，防止答案泄露 */
      $('panel').innerHTML = '<tr><td>🎯 练习中</td><td>状态面板已隐藏——预测后点解说栏对答案</td></tr>';
      $('msg').innerHTML = '<span class="quizhint">🎯 练习中——先预测：下一步会发生什么？</span><br>' +
        '<span style="font-size:12.5px">看左侧画面的高亮与指针：谁会被比较？谁会被移动？结果是多少？<br>心里想好答案后，<b>点这里</b>查看解说与完整状态。</span>';
    }
    updateProgress();
  }

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  function updateProgress() {
    $('pos').textContent = frames.length ? (idx + 1) + ' / ' + frames.length : '0 / 0';
    $('btnPrev').disabled = idx <= 0;
    $('btnNext').disabled = idx >= frames.length - 1;
    $('btnPlay').textContent = timer ? '⏸ 暂停' : '▶ 自动播放';
    var seek = $('seek');
    seek.max = Math.max(frames.length - 1, 0);
    seek.value = idx;
  }
  function step() { if (idx < frames.length - 1) { idx++; draw(); } else stop(); }
  function back() { if (idx > 0) { idx--; draw(); } }
  function play() {
    if (timer) { stop(); return; }
    if (idx >= frames.length - 1) idx = 0;
    timer = setInterval(step, 900 / speed);
    updateProgress();
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; } if (frames.length) updateProgress(); }
  function reset() { stop(); idx = 0; draw(); }

  function bindControls() {
    $('btnReset').onclick = reset;
    $('btnPrev').onclick = back;
    $('btnNext').onclick = function () { stop(); step(); };
    $('btnPlay').onclick = play;
    $('speed').onchange = function (e) { speed = +e.target.value; if (timer) { stop(); play(); } };
    function onSeek(e) {
      var v = parseInt(e.target.value, 10);   // 必须先读值：stop()→updateProgress 会回写滑杆
      if (isNaN(v)) return;
      stop();
      if (!frames.length) { updateProgress(); return; }
      idx = Math.max(0, Math.min(frames.length - 1, v));
      draw();
    }
    $('seek').addEventListener('input', onSeek);
    $('seek').addEventListener('change', onSeek);
    $('btnGuide').onclick = function () { renderGuide(true); };
    $('guide').addEventListener('click', function (e) {
      if (e.target.id === 'btnGo') { rememberDismissed(cur.id); $('guide').hidden = true; }
    });
    $('btnShot').onclick = exportFrame;
    $('btnLink').onclick = copyLink;
    $('btnHandout').onclick = exportHandout;
    $('btnPractice').onclick = togglePractice;
    $('btnProj').onclick = toggleProject;
    $('btnCatalog').onclick = openCatalog;
    try { if (localStorage.getItem('dsc_proj') === '1') { document.body.classList.add('proj'); $('btnProj').classList.add('on'); } } catch (e) {}
    $('msg').addEventListener('click', function () {
      if (practice && revealIdx !== idx) { revealIdx = idx; draw(); }
    });
  }
  var dismissed = {};
  try { dismissed = JSON.parse(localStorage.getItem('dsc_guide') || '{}') || {}; } catch (e) { dismissed = {}; }
  function rememberDismissed(id) {
    dismissed[id] = true;
    try { localStorage.setItem('dsc_guide', JSON.stringify(dismissed)); } catch (e) { /* 私密模式等场景忽略 */ }
  }
  function renderGuide(force) {
    var g = $('guide');
    if (!cur) { g.hidden = true; return; }
    if (cur.guide && cur.guide.length && (force || !dismissed[cur.id])) {
      g.innerHTML = '<div class="gt">💡 使用引导 · ' + esc(cur.disp || cur.name) + '</div><ol>' +
        cur.guide.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') +
        '</ol><button id="btnGo">开始演示 ▶</button>';
      g.hidden = false;
    } else {
      g.hidden = true;
    }
  }
  function toast(text) {
    var t = document.getElementById('toast');
    t.textContent = text; t.hidden = false;
    clearTimeout(toast._h);
    toast._h = setTimeout(function () { t.hidden = true; }, 1800);
  }
  function exportFrame() {
    var svg = document.querySelector('#stage svg');
    if (!svg) { toast('当前没有可导出的画面'); return; }
    var xml = new XMLSerializer().serializeToString(svg);
    var img = new Image();
    img.onload = function () {
      var vb = svg.viewBox.baseVal;
      var canvas = document.createElement('canvas');
      canvas.width = (vb.width || 980) * 2; canvas.height = (vb.height || 470) * 2;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      var a = document.createElement('a');
      var name = (cur ? (cur.disp || cur.name).replace(CIRC_RE, '') : '帧');
      a.download = '数据结构-' + name + '-第' + (idx + 1) + '帧.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
      toast('已导出 PNG 图片');
    };
    img.onerror = function () { toast('导出失败，请改用系统截图'); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
  }
  function copyLink() {
    var url = location.href;
    function ok() { toast('链接已复制，可直接分享'); }
    function fail() { window.prompt('全选并复制本页链接（Ctrl+C）：', url); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok, fail);
    else fail();
  }
  /* ---------- 练习模式：先预测下一步，再点击揭示解说 ---------- */
  var practice = false, revealIdx = -1;
  function togglePractice() {
    practice = !practice; revealIdx = -1;
    $('btnPractice').classList.toggle('on', practice);
    $('msg').classList.toggle('quizcover', practice);
    draw();
    toast(practice ? '练习模式：解说与状态已遮住——先预测，再点解说栏对答案' : '已退出练习模式');
  }
  /* ---------- 投影模式：大字号高对比，便于课堂投屏 ---------- */
  function toggleProject() {
    var on = document.body.classList.toggle('proj');
    try { localStorage.setItem('dsc_proj', on ? '1' : ''); } catch (e) {}
    $('btnProj').classList.toggle('on', on);
  }
  /* ---------- 总目录：按章分组全景，一键直达 / 复制深链接 ---------- */
  function moduleURL(m) {
    return location.origin + location.pathname + '#m=' + m.id;
  }
  function openCatalog() {
    var html = '<div class="ovhead"><b>📚 全部动画目录</b><span>' + DSC.mods.length + ' 个动画 · 点击卡片直达</span>' +
      '<button id="ovClose">✕</button></div>';
    var chapters = [];
    DSC.mods.forEach(function (m) { if (chapters.indexOf(m.ch) < 0) chapters.push(m.ch); });
    chapters.sort(function (a, b) { return a - b; });
    chapters.forEach(function (c) {
      html += '<div class="ovch">' + esc(CH[c] ? CH[c].name : ('第' + c + '章')) +
        (CH[c] ? ' <i>' + esc(CH[c].note) + '</i>' : '') + '</div><div class="ovgrid">';
      DSC.mods.filter(function (m) { return m.ch === c; }).forEach(function (m) {
        html += '<div class="ovcard" data-id="' + m.id + '"><b>' + esc(m.disp || m.name) + '</b>' +
          '<span>' + esc(m.note || '') + '</span>' +
          '<div class="ovbtns"><button data-act="go">打开 ▶</button>' +
          '<button data-act="qr">二维码</button>' +
          '<button data-act="copy">复制链接</button></div></div>';
      });
      html += '</div>';
    });
    var ov = document.createElement('div');
    ov.id = 'catalog'; ov.innerHTML = html;
    document.body.appendChild(ov);
    ov.addEventListener('click', function (e) {
      var act = e.target.dataset && e.target.dataset.act;
      var card = e.target.closest ? e.target.closest('.ovcard') : null;
      if (e.target.id === 'ovClose' || e.target === ov) { document.body.removeChild(ov); return; }
      if (!card) return;
      var m = DSC.mods.filter(function (x) { return x.id === card.dataset.id; })[0];
      if (!m) return;
      if (act === 'go') {
        document.body.removeChild(ov);
        location.hash = '#m=' + m.id;
        applyHash(parseHash());
      } else if (act === 'qr') {
        var old = document.getElementById('qrbox');
        if (old) old.parentNode.removeChild(old);
        var qb = document.createElement('div');
        qb.id = 'qrbox';
        qb.innerHTML = '<div class="qrt"><b>' + esc(m.disp || m.name) + '</b> 手机扫码直达<button id="qrx">✕</button></div><div class="qrb"></div>';
        document.body.appendChild(qb);
        try {
          var qr = window.qrcode ? window.qrcode(0, 'M') : null;
          if (qr) {
            qr.addData(moduleURL(m));
            qr.make();
            qb.querySelector('.qrb').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
          } else {
            qb.querySelector('.qrb').textContent = '二维码组件未加载';
          }
        } catch (e) { qb.querySelector('.qrb').textContent = '链接过长，请用复制链接'; }
        qb.addEventListener('click', function (ev) { if (ev.target.id === 'qrx' || ev.target === qb) qb.parentNode.removeChild(qb); });
      } else if (act === 'copy') {
        var url = moduleURL(m);
        if (navigator.clipboard && navigator.clipboard.writeText)
          navigator.clipboard.writeText(url).then(function () { toast('已复制：' + (m.disp || m.name)); }, function () { window.prompt('全选复制：', url); });
        else window.prompt('全选复制：', url);
      }
    });
  }
  /* ---------- 讲义导出：当前动画取 6 个关键帧拼成 2×3 网格 PNG ---------- */
  function exportHandout() {
    if (!frames.length || !cur) { toast('当前没有可导出的动画'); return; }
    var idxs = [];
    for (var k = 0; k < 6; k++) idxs.push(Math.round(k * (frames.length - 1) / 5));
    var done = 0;
    var cellW = 980, cellH = 490, cols = 2, rows = 3;
    var canvas = document.createElement('canvas');
    canvas.width = cols * cellW; canvas.height = rows * cellH + 60;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0f2c5c';
    ctx.font = 'bold 30px "Microsoft YaHei",sans-serif';
    ctx.fillText((cur.disp || cur.name) + ' — 关键帧讲义（' + frames.length + ' 帧选 6）', 24, 42);
    idxs.forEach(function (fi, k2) {
      var svgStr = cur.render(frames[fi].snap);
      var xml = new XMLSerializer().serializeToString(new DOMParser().parseFromString(svgStr, 'image/svg+xml').documentElement);
      var img = new Image();
      img.onload = function () {
        var cx = (k2 % cols) * cellW, cy = 60 + Math.floor(k2 / cols) * cellH;
        ctx.fillStyle = '#ffffff'; ctx.fillRect(cx, cy, cellW, cellH);
        ctx.drawImage(img, cx, cy, cellW * 0.98, cellH * 0.94);
        ctx.fillStyle = '#5f6b76'; ctx.font = '20px Consolas,monospace';
        ctx.fillText('第 ' + (fi + 1) + ' / ' + frames.length + ' 帧', cx + 18, cy + cellH - 10);
        done++;
        if (done === 6) {
          var a = document.createElement('a');
          a.download = '数据结构-' + (cur.disp || cur.name).replace(CIRC_RE, '') + '-讲义.png';
          a.href = canvas.toDataURL('image/png');
          a.click();
          toast('讲义已导出 PNG（6 关键帧）');
        }
      };
      img.onerror = function () { done++; };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
    });
  }
  function keys(e) {
    if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight') { stop(); step(); }
    else if (e.key === 'ArrowLeft') { stop(); back(); }
    else if (e.key === ' ') { e.preventDefault(); play(); }
    else if (e.key === 'Home') { stop(); idx = 0; draw(); }
    else if (e.key === 'End') { stop(); if (frames.length) { idx = frames.length - 1; draw(); } }
  }

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  }
})();

</script>
<script>
/* ==================== ch1/01complexity.js ==================== */
/* 动画：时间复杂度可视化——常见阶的增长曲线（对数纵轴）与逐 n 数值对比（教材 1.4） */
(function () {
  var DSC = window.DSC, h = DSC.h, C = DSC.C;

  var CODE = [
    '常见时间复杂度（n 为问题规模）：',
    '  O(1)      常数阶：与 n 无关（顺序表取值）',
    '  O(log n)  对数阶：每次折半（折半查找）',
    '  O(n)      线性阶：扫一遍（顺序查找）',
    '  O(n log n)：分治一层 O(n) × log n 层（归并/快排平均）',
    '  O(n²)     平方阶：双重循环（简单排序）',
    '  O(2ⁿ)     指数阶：子集枚举——n 稍大就不可行',
    '对数纵轴：每上升一格 = 代价 ×10。直线 = 指数增长！'
  ];

  var FNS = [
    { name: 'O(1)', f: function () { return 1; }, color: '#16a34a' },
    { name: 'O(log n)', f: function (n) { return Math.log2(n); }, color: '#2563eb' },
    { name: 'O(n)', f: function (n) { return n; }, color: '#9333ea' },
    { name: 'O(n log n)', f: function (n) { return n * Math.log2(Math.max(n, 1.5)); }, color: '#d97706' },
    { name: 'O(n²)', f: function (n) { return n * n; }, color: '#dc2626' },
    { name: 'O(2ⁿ)', f: function (n) { return Math.pow(2, n); }, color: '#0f172a' }
  ];
  function sup(k) { return String(k).split('').map(function (d) { return '⁰¹²³⁴⁵⁶⁷⁸⁹'[+d] || d; }).join(''); }
  function fmt(x) { return x < 1e6 ? String(Math.round(x * 10) / 10) : x.toExponential(2); }

  DSC.reg({
    id: 'complexity', ch: 1, name: '时间复杂度可视化',
    note: '教材 1.4 算法与算法分析（增长速度分级、渐近符号）',
    guide: [
      '拖动进度条观察 n = 1 → 你设定的最大规模：纵轴是**对数刻度**（每格 ×10），直线 = 指数增长',
      '对数轴下各阶曲线**不会重叠**：O(n²) 近似一条直线，O(2ⁿ) 更陡——这是它们真实的倍数关系',
      'n=10 时 n² 与 n log n 只差几倍；n=50 已经差一个数量级；n 再大，O(2ⁿ) 直接天文数字',
      '结论：机器快 1000 倍也救不了 O(2ⁿ)——选对复杂度才是算法设计的核心。考试排序：O(1)<O(log n)<O(n)<O(n log n)<O(n²)<O(2ⁿ)'
    ],
    inputs: [
      { key: 'nmax', label: '最大规模 n', type: 'number', value: 16, min: 4, max: 64 }
    ],
    run: function (v) {
      var NMAX = Math.min(64, Math.max(4, Math.round(+v.nmax || 16)));
      var frames = [];
      for (var n = 1; n <= NMAX; n++) {
        var vals = FNS.map(function (f) { return { name: f.name, v: f.f(n), color: f.color }; });
        frames.push({
          line: [n % 8 + 1], msg: 'n = ' + n + '：' + vals.map(function (x) { return x.name + ' = ' + fmt(x.v); }).join('，') + (n === 1 ? '。拖动进度条观察各阶增长（对数轴，每格 ×10）。' : n === NMAX ? '。O(2^' + NMAX + ') 已是 ' + fmt(Math.pow(2, NMAX)) + '——指数阶在真实机器上不可行。' : ''),
          panel: (function () {
            var p = {};
            vals.forEach(function (x) { p[x.name] = fmt(x.v); });
            return p;
          })(),
          snap: { n: n, nmax: NMAX, vals: vals, mark: n === NMAX ? 'final' : undefined }
        });
      }
      return { code: CODE, frames: frames };
    },
    render: function (s) {
      var W = 980, H = 500;
      var n = s.n, NMAX = s.nmax || 32;
      var ox = 96, oy = 56, pw = W - ox - 60, ph = H - oy - 150;
      var yMax = NMAX * Math.LN10 * 0.4343;   // log10(2^NMAX)
      var g = '';
      g += h.txt(W / 2, 30, '常见时间复杂度增长曲线（对数纵轴 · 当前 n = ' + n + '）', { size: 17, w: 600 });
      /* 横网格：10^0,10^3,… */
      var step = yMax > 12 ? 3 : (yMax > 5 ? 2 : 1);
      for (var e = 0; e <= yMax + 0.001; e += step) {
        var y = oy + ph * (1 - e / yMax);
        g += h.line(ox, y, ox + pw, y, { stroke: '#eef2f7', sw: 1 });
        g += h.txt(ox - 8, y + 4, e === 0 ? '1' : '10' + sup(e), { size: 10.5, fill: C.muted, anchor: 'end' });
      }
      for (var gx = 0; gx <= 4; gx++) {
        var x = ox + pw * gx / 4;
        g += h.line(x, oy, x, oy + ph, { stroke: '#eef2f7', sw: 1 });
        g += h.txt(x, oy + ph + 16, String(Math.round(NMAX * gx / 4)), { size: 10, fill: C.muted });
      }
      g += h.txt(ox + pw / 2, oy + ph + 34, 'n', { size: 12, fill: C.muted });
      g += h.txt(ox - 44, oy - 18, '代价（×10/格）', { size: 11, fill: C.muted, anchor: 'start' });
      /* 曲线：对数映射 log10(max(1,v))；逐帧只画到当前 n——曲线随 n 生长 */
      function Y(val) { return oy + ph * (1 - Math.log10(Math.max(1, val)) / yMax); }
      FNS.forEach(function (f) {
        var pts = [];
        for (var k = 0; k <= 72; k++) {
          var nn = 1 + (NMAX - 1) * k / 72;
          if (nn > n + 1e-9) break;          // 生长前沿：只画到当前 n
          pts.push([ox + pw * (nn - 1) / (NMAX - 1), Y(f.f(nn))]);
        }
        if (pts.length < 2) return;
        g += '<path d="M' + pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' L') + '" fill="none" stroke="' + f.color + '" stroke-width="2.2" opacity="0.92"/>';
      });
      /* 当前 n 竖线（生长前沿）+ 数值点 */
      var cx = ox + pw * (n - 1) / (NMAX - 1);
      if (n > 1) g += h.line(cx, oy, cx, oy + ph, { stroke: C.ink, sw: 1.6, dash: '5,4' });
      FNS.forEach(function (f) {
        g += h.circle(cx, Y(f.f(n)), 5.5, { fill: f.color, stroke: '#fff', sw: 1.5 });
      });
      /* 图例（按当前值排序） */
      var sorted = FNS.map(function (f) { return { name: f.name, v: f.f(n), color: f.color }; }).sort(function (a, b) { return a.v - b.v; });
      sorted.forEach(function (it, i) {
        var x = ox + (i % 3) * 190, y = oy + ph + 56 + Math.floor(i / 3) * 24;
        g += h.rect(x, y - 12, 14, 14, { fill: it.color, rx: 3 });
        g += h.txt(x + 20, y, it.name + ' = ' + fmt(it.v), { size: 12.5, anchor: 'start', family: 'Consolas,monospace' });
      });
      g += h.txt(W / 2, H - 10, '对数刻度（每格 ×10）：曲线永不上顶重叠——O(n²) 近似直线、O(2ⁿ) 一路更陡，倍数关系一目了然', { size: 12.5, fill: C.muted });
      return h.svg(W, H, g);
    }
  });
})();


/* ==================== ch2/01seqList.js ==================== */
/* 动画1：顺序表的插入与删除（教材算法2.3/2.5思路，默认数据取自 cp2-01 PPT 例 25,12,47,89,36,14） */
(function () {
  var DSC = window.DSC, h = DSC.h, C = DSC.C;
  var MAXSIZE = 10;

  DSC.reg({
    id: 'seqList', ch: 2, name: '① 顺序表的插入与删除',
    note: '教材 2.4 线性表的顺序表示和实现（插入/删除、移动次数分析）',
    guide: [
      '顶部选择"插入/删除"，改位置 i 或初始序列后自动重新演示',
      '看重点：元素逐格移动，源格显示"空"，空位向插入点/表尾迁移',
      '对照提示条公式：插入移动 n−i+1 次（平均 n/2）、删除移动 n−i 次（平均 (n−1)/2）',
      '勾选"错误演示：从前往后移"，看数据被覆盖的后果'
    ],
    inputs: [

      { key: 'data', label: '初始序列', type: 'text', value: '25,12,47,89,36,14' }
    ],
    run: function (v) {
      var a = (v.data || '').split(/[,，\s]+/).filter(function (s) { return s !== ''; }).map(Number);
      if (a.some(function (x) { return Number.isNaN(x); })) throw new Error('初始序列请输入逗号分隔的数字，如 25,12,47,89,36,14');

          var lostAt = next[p];
          next[p] = sid;                                   // ✗ 先"后连"
          F(4, '✗ 错误写法第一步：p->next = s。此时 p 原来的后继（' + vals.slice(i - 1).join(', ') + '）失去了唯一入口，已经从链上脱落！',
            { 'p->next': '→ s（错误）' }, snap({ p: p, s: sid, ghost: [sid], lostFrom: lostAt }));
          next[sid] = next[p];                             // ✗ s->next = p->next = s 自环
          F(5, '✗ 错误写法第二步：s->next = p->next，而 p->next 已经是 s 自己——s->next 指向 s，形成自环；' + vals.slice(i - 1).join(', ') + ' 全部丢失！',
            { 's->next': '→ s（自环）' }, snap({ p: p, s: sid, ghost: [sid], selfLoopDone: true }));
          F(5, '结论：两步顺序绝不能颠倒。必须先执行 s->next = p->next（先连），再执行 p->next = s（后断）。',
            { 结果: '链已断裂' }, snap({ p: p, s: sid, ghost: [sid], selfLoopDone: true, err: true }));
        }
        return { code: code, frames: frames };
      }

      /* ---------- 删除 ---------- */
      var p2 = 'H', j2 = 0;
      F(0, '初始化：p 指向头结点，j = 0。', { p: 'p → 头结点', j: 'j = 0' }, snap({ p: p2, j: j2 }));
      var okWalk2 = true;
      while (next[p2] && j2 < i - 1) {
        p2 = next[p2]; j2++;
        F([1, 2], 'p 后移：p → ' + nodes[p2].data + '（第 ' + j2 + ' 个结点），j = ' + j2 + '。',
          { p: 'p → ' + nodes[p2].data, j: 'j = ' + j2 }, snap({ p: p2, j: j2 }));
      }
      if (!next[p2] || j2 > i - 1) {
        F(4, 'i = ' + i + ' 不合法（不存在第 i 个结点）。算法返回 ERROR。', { 结果: 'ERROR（i 不合法）' }, snap({ p: p2, j: j2, err: true }));
        return { code: code, frames: frames };
      }
      var q = next[p2];
      F(5, 'q = p->next：q 指向待删除的第 ' + i + ' 个结点（值 ' + nodes[q].data + '）。',
        { p: 'p → ' + nodes[p2].data, q: 'q → ' + nodes[q].data }, snap({ p: p2, q: q }));
      var after = next[q];
      next[p2] = after;
      F(6, '① 摘链：p->next = q->next。p 越过 q 直接连到后继' + (after ? '（值 ' + nodes[after].data + '）' : '（NULL）') + '，q 脱离链表（此时还没释放）。',
        { 'p->next': after ? '→ ' + nodes[after].data : '→ NULL' }, snap({ p: p2, q: q, ghost: [q], removed: q }));
      F(7, '② free(q) 释放结点 q（值 ' + nodes[q].data + '）。删除完成：L = ( ' + vals.filter(function (_, k) { return k !== i - 1; }).join(', ') + ' )。同样只需改一个指针，不必移动元素。',
        { 结果: '删除成功' }, snap({ p: p2, removed: q, freed: q, done: true }));
      return { code: code, frames: frames };
    },
    render: function (s) {
      var total = s.chain.length + (s.s && s.chain.indexOf(s.s) < 0 ? 1 : 0) +
        (s.lost || []).length + (s.removed ? 1 : 0);
      var W = Math.max(980, 70 + total * 152), H = 430, nw = 92, nh = 46, y0 = 150, gap = 12;
      var pos = {};       // id -> {x,y,row}
      var g = '';
      g += h.txt(W / 2, 34, '单链表（带头结点）', { size: 19, w: 600 });
      // 主链一行
      var x = 30;
      for (var k = 0; k < s.chain.length; k++) {
        var id = s.chain[k];
        pos[id] = { x: x, y: y0, row: 0 };
        x += nw + 46 + gap;
      }
      // s 结点位置：放在链末端之后或 p 之后 —— 放在主链后面一格
      if (s.s && !pos[s.s]) { pos[s.s] = { x: x, y: y0, row: 0 }; x += nw + 46 + gap; }
      // ghost 结点跟随
      (s.ghost || []).forEach(function (id) { if (!pos[id] && !s.removed) { pos[id] = { x: x, y: y0, row: 0 }; x += nw + 46 + gap; } });
      // 丢失结点第二行
      var lx = 60;
      (s.lost || []).forEach(function (id) { pos[id] = { x: lx, y: y0 + 150, row: 1 }; lx += nw + 46 + gap; });
      if ((s.lost || []).length) g += h.txt(60 + (lx - 60 - gap) / 2 - (nw / 2), y0 + 118, '已从链上脱落（无法再访问）', { size: 14, fill: C.red, w: 600 });
      if (s.removed && !pos[s.removed]) { pos[s.removed] = { x: lx, y: y0 + 150, row: 1 }; }

      function nodeX(id) { return pos[id].x; }
      function drawNode(id) {
        var P = pos[id], nd = s.nodes[id], isHead = id === 'H';
        var isS = id === s.s, isGhost = (s.ghost || []).indexOf(id) >= 0, isLost = (s.lost || []).indexOf(id) >= 0, isFreed = s.freed === id;
        var fill = '#fff', stroke = C.grey, sw = 1.5, dash = null;
        if (isHead) { fill = C.blueBg; stroke = C.blue; }
        if (isS) { fill = C.amberBg; stroke = C.amber; sw = 2.5; }

        if (isFreed) { fill = C.redBg; stroke = C.red; dash = '5,4'; }
        var label = isHead ? '头' : nd.data;
        var dW = 56, pW = 32;
        g += h.rect(P.x, P.y, dW, nh, { fill: fill, stroke: stroke, sw: sw, rx: 6, dash: dash });
        g += h.rect(P.x + dW, P.y, pW, nh, { fill: fill, stroke: stroke, sw: sw, rx: 6, dash: dash });
        g += h.txt(P.x + dW / 2, P.y + nh / 2 + 6, label, { size: 17, w: 600, fill: isFreed ? C.red : C.ink });
        g += h.txt(P.x + dW + pW / 2, P.y + nh / 2 + 6, '·', { size: 24, w: 700 });
        if (isHead) g += h.txt(P.x + dW / 2, P.y - 10, '头结点 L', { size: 12, fill: C.blue });
        if (isS) g += h.txt(P.x + dW / 2, P.y - 10, 's（新结点）', { size: 12, fill: C.amber, w: 600 });
        if (isFreed) g += h.txt(P.x + dW / 2, P.y - 10, '✗ 已 free', { size: 12, fill: C.red });
        if (isLost) g += h.txt(P.x + dW / 2, P.y + nh + 18, '✗ 丢失', { size: 13, fill: C.red, w: 600 });
        // 自环

          g += '<path d="M' + (P.x + dW + pW) + ' ' + (P.y + 8) + ' C' + (cx + 40) + ' ' + (P.y - 30) + ' ' + (cx + 10) + ' ' + (P.y - 30) + ' ' + (P.x + dW + 6) + ' ' + (P.y + 4) + '" fill="none" stroke="' + C.red + '" stroke-width="2.5"/>';
          g += h.txt(cx + 26, P.y - 36, 's->next=s 自环', { size: 12, fill: C.red, w: 600 });
        }
      }
      // 链接箭头（按 next 关系画，分主链/脱落）
      Object.keys(s.next).forEach(function (from) {
        var to = s.next[from];
        if (to === null || !pos[from] || !pos[to]) return;
        var A = pos[from], B = pos[to];
        var x1 = A.x + 92, y1 = A.y + nh / 2, x2 = B.x, y2 = B.y + nh / 2;
        var isCur = (s.newLink && s.newLink[0] === from && s.newLink[1] === to);
        var ghosted = A.row === 1 || (s.ghost || []).indexOf(from) >= 0 && from !== s.p && from !== s.s;
        var stroke = C.grey, sw = 2, dash = null;
        if (isCur) { stroke = C.amber; sw = 3; }
        else if (A.row === 1 || B.row === 1) { stroke = C.grey; dash = '5,4'; }
        else if (s.done && A.row === 0) { stroke = C.green; sw = 2.5; }
        else if (from === s.p && !s.done) { stroke = C.blue; sw = 2; }
        if (s.selfLoopDone && to === from) return;
        g += h.arrow(x1, y1, x2, y2, { stroke: stroke, sw: sw, dash: dash, head: 7 });
      });
      // 指针 p / q
      function ptr(id, name, col) {
        if (!id || !pos[id]) return;
        var P = pos[id];
        var px = P.x + 28, py = P.y - 44;
        g += h.txt(px, py - 6, name, { size: 16, fill: col, w: 700, family: 'Consolas,monospace' });
        g += h.arrow(px, py, px, P.y - 6, { stroke: col, sw: 2.5, head: 7 });
      }
      ptr(s.p, 'p', C.blue);
      ptr(s.q, 'q', C.green);
      s.chain.concat(s.lost || []).concat(s.ghost || []).concat(s.removed ? [s.removed] : [])
        .filter(function (id, k, arr) { return pos[id] && arr.indexOf(id) === k; })
        .forEach(drawNode);
      // 完成后的序列
      if (s.done || s.err) {
        var vals2 = s.chain.filter(function (id) { return id !== 'H'; }).map(function (id) { return s.nodes[id].data; });
        if (s.selfLoopDone && s.s) vals2.push(s.nodes[s.s].data + '(自环)');
        var msg2 = (s.err ? '✗ 断链结果：' : '当前链表：') + '头 → ' + (vals2.length ? vals2.join(' → ') : '空') + ' → NULL';
        g += h.rect(W / 2 - 300, H - 52, 600, 34, { fill: s.err ? C.redBg : C.greenBg, stroke: s.err ? C.red : C.green, rx: 8 });
        g += h.txt(W / 2, H - 30, msg2, { size: 14, fill: s.err ? C.red : C.green, w: 600 });
      }
      return h.svg(W, H, g);
    }
  });

/* 动画：顺序表基本操作合集——按值查找/取值/求表长/求最大值/遍历（教材 2.4） */
(function () {

  var CODE = [
    'int LocateElem(SqList L, ElemType e) {   // 按值查找',

    '    return 0;                              // 未找到',
    '}',
    'ElemType GetElem(SqList L, int i) { return L.elem[i-1]; }  // 取值 O(1)',
    'int MaxElem(SqList L) {                   // 求最大值',
    '    max = L.elem[0];',
    '    for (i = 1; i < L.length; ++i)',
    '        if (L.elem[i] > max)  max = L.elem[i];',
    '    return max;',
    '}'
  ];

  DSC.reg({
    id: 'seqOps', ch: 2, name: '顺序表基本操作合集',

    guide: [
      '按值查找：逐格比较（黄色=正在比较），失败要扫满全表 O(n)',
      '取值：位序 i 直接映射下标 i−1，**一步到位 O(1)**——顺序表随机存取的核心优势',
      '求最大值：带"当前最大"标记扫一遍，n 个元素比较 n−1 次',
      '求表长直接读 L.length；这些操作都没有元素移动——移动只发生在插入/删除时'
    ],
    inputs: [
      { key: 'op', label: '操作', type: 'select', options: [
        ['find', '按值查找 LocateElem'], ['get', '取值 GetElem'], ['len', '求表长 Length'],
        ['max', '求最大值 MaxElem'], ['trav', '遍历输出 Traverse']
      ], value: 'find' },
      { key: 'key', label: 'e / 位序 i', type: 'number', value: 47, min: -999, max: 999 },
      { key: 'data', label: '初始序列', type: 'text', value: '25,12,47,89,36,14' }
    ],
    run: function (v) {
      var arr = h.parse(v.data);
      if (arr.length < 1 || arr.length > 12) throw Error('请输入 1~12 个整数');
      var n = arr.length, op = v.op, k = +v.key || 0;
      var frames = [], cmp = 0;
      function colors(hl) {
        hl = hl || {};
        var cs = [];
        for (var i = 0; i < n; i++) cs.push('N');
        (hl.done || []).forEach(function (i2) { cs[i2] = 'D'; });
        if (hl.c != null) cs[hl.c] = 'C';
        if (hl.hit != null) cs[hl.hit] = 'S';
        if (hl.m != null) cs[hl.m] = 'P';

      }
      function F(line, msg, extra, mk) {
        extra = extra || {};
        frames.push({
          line: Array.isArray(line) ? line : [line], msg: msg,
          panel: { 比较: cmp + ' 次', 表长: 'n = ' + n, 结果: extra.res || '…' },
          snap: { arr: arr.slice(), colors: colors(extra), tag: extra.tag || '', res: extra.res || null, mark: mk }
        });
      }
      F(0, '顺序表 L =（' + arr.join(', ') + '），n = ' + n + '。位序 i 从 1 起，下标 = i−1。', {});

      if (op === 'find') {
        var found = -1;
        for (var i = 0; i < n; i++) {
          cmp++;
          if (arr[i] === k) { found = i; F([2], 'elem[' + i + ']=' + arr[i] + ' = ' + k + '，命中！返回位序 ' + (i + 1) + '。', { hit: i, res: '位序 ' + (i + 1) }, 'found'); break; }
          F([2], 'elem[' + i + ']=' + arr[i] + ' ≠ ' + k + '，继续。', { c: i });
        }
        if (found < 0) F([3], '扫描全表未找到 ' + k + ' → 返回 0。共比较 ' + n + ' 次——最坏情形 O(n)。', { res: '未找到' }, 'fail');
        F(0, '小结：按值查找 O(n)。等概率成功 ASL=(n+1)/2=' + ((n + 1) / 2).toFixed(1) + '。想 O(1) 查找 → 第 7 章散列表。', { hit: found >= 0 ? found : undefined, res: found >= 0 ? '位序 ' + (found + 1) : '未找到' });
      } else if (op === 'get') {
        if (k < 1 || k > n) F(0, 'i = ' + k + ' 不合法（合法范围 1 ≤ i ≤ ' + n + '）→ 返回 ERROR。', { res: 'ERROR：i 越界' }, 'err');
        else F(5, 'elem[' + (k - 1) + '] = ' + arr[k - 1] + '。位序 ' + k + ' 直接映射下标 ' + (k - 1) + '，**一次寻址 O(1)**，与 n 无关。', { hit: k - 1, res: '第 ' + k + ' 个 = ' + arr[k - 1] }, 'ok');
      } else if (op === 'len') {
        F(0, 'L.length 是顺序表结构体里现成的字段：n = ' + n + '，**O(1) 直接读**（链表则要数一遍 O(n)）。', { done: arr.map(function (_, i) { return i; }), res: 'n = ' + n }, 'ok');
      } else if (op === 'max') {
        var mx = 0;
        for (var i2 = 1; i2 < n; i2++) {
          cmp++;
          if (arr[i2] > arr[mx]) { mx = i2; F([8], 'elem[' + i2 + ']=' + arr[i2] + ' > 当前最大 elem[' + (mx === i2 ? i2 : mx) + '] → 更新最大值候选。', { m: i2, c: i2 }); }
          else F([8], 'elem[' + i2 + ']=' + arr[i2] + ' ≤ 当前最大 ' + arr[mx] + '，不更新。', { m: mx, c: i2 });
        }

      } else {

      }

    },
    render: function (s) {

        g += h.rect(x, y, cw, 56, { fill: cm[0], stroke: cm[1], sw: key === 'N' ? 1.5 : 2.4, rx: 7 });

        g += h.txt(x + cw / 2, y + 76, '下标 ' + i, { size: 11, fill: C.muted });
        g += h.txt(x + cw / 2, y + 94, '位序 ' + (i + 1), { size: 11, fill: C.muted });
      }
      for (var j = n; j < 12; j++) g += h.rect(x0 + j * (cw + 10), y, cw, 56, { fill: '#fbfcfe', stroke: C.line, sw: 1, rx: 7, dash: '5,4' });
      if (s.tag) g += h.txt(W / 2, 350, s.tag, { size: 15, w: 700, fill: C.blue });
      g += h.txt(W / 2, 400, '蓝=当前最大  黄=比较  绿=命中  灰虚线=空闲空间', { size: 12.5, fill: C.muted });
      return h.svg(W, H, g);
    }
  });
})();

/* 动画：单链表基本操作合集——按值查找/求表长/取值（p 指针逐结点后移，教材 2.5） */
(function () {
  var DSC = window.DSC, h = DSC.h, C = DSC.C;

  var CODE = [
    'LNode* LocateElem(LinkList L, ElemType e) {  // 按值查找',
    '    p = L->next;',

    '    return p;                                 // NULL 即未找到',
    '}',
    'int Length(LinkList L) {                     // 求表长',
    '    n = 0;  p = L->next;',
    '    while (p) { ++n;  p = p->next; }',
    '    return n;                                 // O(n)：链表没有"长度字段"捷径',
    '}',
    'ElemType GetElem(LinkList L, int i) {        // 取第 i 个',
    '    p = L->next;  j = 1;',

  DSC.reg({
    id: 'linkOps', ch: 2, name: '单链表基本操作合集',

      '求表长也要数完整条链 O(n)——对比顺序表直接读 length 字段 O(1)',

    ],
    inputs: [
      { key: 'op', label: '操作', type: 'select', options: [
        ['find', '按值查找 LocateElem'], ['len', '求表长 Length'], ['get', '取值 GetElem']
      ], value: 'find' },
      { key: 'key', label: 'e / 位序 i', type: 'number', value: 47, min: -999, max: 999 },
      { key: 'data', label: '初始序列', type: 'text', value: '25,12,47,89,36,14' }
    ],
    run: function (v) {

      var frames = [], cmp = 0;
      function F(msg, extra, mk) {
        extra = extra || {};
        frames.push({
          line: Array.isArray(extra.line) ? extra.line : (extra.line != null ? [extra.line] : [2]), msg: msg,
          panel: { 比较计数: cmp + ' 次', 'p 位置': extra.at != null ? '第 ' + (extra.at + 1) + ' 个结点' : '表头 L', 结果: extra.res || '…' },
          snap: { arr: arr.slice(), at: extra.at, hit: extra.hit, res: extra.res || null, mark: mk, hops: extra.hops != null ? extra.hops : (extra.at != null ? extra.at + 1 : 0) }
        });
      }
      F('p 指向头结点 L（头结点不存数据，只是入口）。', { at: -1 });

      if (op === 'find') {
        var found = -1;
        for (var i = 0; i < n; i++) {
          cmp++;
          if (arr[i] === k) { found = i; F('p->data = ' + arr[i] + ' = ' + k + '，命中！返回结点指针。', { at: i, hit: i, res: '找到（第 ' + (i + 1) + ' 个结点）', line: 3 }, 'found'); break; }
          F('p->data = ' + arr[i] + ' ≠ ' + k + ' → p = p->next，后移。', { at: i, line: 3 });
        }
        if (found < 0) F('p 走到 NULL——链上没有 ' + k + '，查找失败。共比较 ' + n + ' 次。', { at: n, res: '未找到', line: 3 }, 'fail');

/* 动画：合并有序表 LA/LB→LC（双指针归并，教材 2.7 应用，为归并排序铺垫） */
(function () {
  var DSC = window.DSC, h = DSC.h, C = DSC.C;

  var CODE = [
    'void MergeList(SqList La, SqList Lb, SqList &Lc) {',
    '    // La、Lb 非递减有序',
    '    i = j = 1;  k = 0;',
    '    while (i <= La.len && j <= Lb.len) {     // 两表都还有剩余',
    '        if (La[i] <= Lb[j])  Lc[++k] = La[i++];   // 取较小者（相等取A，稳定）',
    '        else                 Lc[++k] = Lb[j++];',
    '    }',
    '    while (i <= La.len)  Lc[++k] = La[i++];  // 收尾：A 剩余',
    '    while (j <= Lb.len)  Lc[++k] = Lb[j++];  // 收尾：B 剩余',
    '}'
  ];

  function parseSorted(s, name) {
    var a = DSC.h.parse(s);
    for (var i = 1; i < a.length; i++) if (a[i] < a[i - 1]) throw Error(name + ' 必须非递减有序（' + a[i - 1] + ' 后出现 ' + a[i] + '）');
    if (a.length < 1 || a.length > 8) throw Error(name + ' 请输入 1~8 个整数');
    return a;
  }

  DSC.reg({
    id: 'mergeList', ch: 2, name: '合并有序表 LA+LB→LC',
    note: '教材 2.7 线性表应用（双指针归并，O(m+n)）',
    guide: [
      '两个有序表各出一个指针 i、j：每次比较，**较小者**进入 LC，对应指针后移',
      '相等时取 LA（黄色提示）——归并是稳定操作，这个细节决定了归并排序的稳定性',
      '某表用尽后，另一表的剩余**整体接上**（已有序，无需再比）',
      '只比较 m+n−1 次以内，O(m+n)——归并排序的每一层就是这个过程'
    ],
    inputs: [
      { key: 'la', label: 'LA（有序）', type: 'text', value: '3,5,8,11' },
      { key: 'lb', label: 'LB（有序）', type: 'text', value: '2,6,8,9,15' }
    ],
    run: function (v) {
      var A = parseSorted(v.la, 'LA'), B = parseSorted(v.lb, 'LB');
      var frames = [], cmp = 0;
      var LC = [];
      function colors(a, hl) {
        hl = hl || {};
        var cs = [];
        for (var i = 0; i < a; i++) cs.push('N');
        if (hl.ai != null && hl.which !== 'B') cs[hl.ai] = 'C';
        if (hl.bi != null && hl.which === 'B') cs[hl.bi] = 'C';
        return cs;
      }
      function F(line, msg, extra, mk) {
        extra = extra || {};
        frames.push({
          line: Array.isArray(line) ? line : [line], msg: msg,
          panel: { 比较: cmp + ' 次', 'LC 当前': LC.join(', ') || '（空）' },
          snap: { A: A, B: B, LC: LC.slice(), ca: extra.ca, cb: extra.cb, ai: extra.ai, bi: extra.bi, mark: mk }
        });
      }
      F(0, 'LA =（' + A.join(', ') + '），LB =（' + B.join(', ') + '），i、j 分别指向两表开头。', { ca: 0, cb: 0 });
      var i = 0, j = 0;
      while (i < A.length && j < B.length) {
        cmp++;
        if (A[i] <= B[j]) {
          LC.push(A[i]);
          F([4], 'LA[' + (i + 1) + ']=' + A[i] + (A[i] === B[j] ? ' = ' : ' < ') + 'LB[' + (j + 1) + ']=' + B[j] + (A[i] === B[j] ? '（相等 → 取 LA，保证稳定）' : '') + ' → 进 LC[' + LC.length + ']，i 后移。', { ai: i, which: 'A' });
          i++;
        } else {
          LC.push(B[j]);
          F([5], 'LA[' + (i + 1) + ']=' + A[i] + ' > LB[' + (j + 1) + ']=' + B[j] + ' → LB[' + (j + 1) + '] 进 LC[' + LC.length + ']，j 后移。', { bi: j, which: 'B' });
          j++;
        }
      }
      F([6, 7], '某表已用尽（i=' + (i + 1) + '，j=' + (j + 1) + '）：剩余元素整体接上。', {});
      while (i < A.length) { LC.push(A[i]); F(7, 'LA 剩余 ' + A[i] + ' 直接接入 LC。', { ai: i }); i++; }
      while (j < B.length) { LC.push(B[j]); F(8, 'LB 剩余 ' + B[j] + ' 直接接入 LC。', { bi: j }); j++; }
      F(0, '合并完成：LC =（' + LC.join(', ') + '），共 ' + LC.length + ' 个元素、仅比较 ' + cmp + ' 次。LC 天然有序——归并的两个输入都有序，每次只挑"当前最小"。', {}, 'final');
      return { code: CODE, frames: frames };
    },
    render: function (s) {
      var W = 980, H = 520;
      var g = '';
      function row(y, label, arr, ci, done, color) {
        var out = h.txt(60, y + 26, label, { size: 14, fill: C.muted, anchor: 'start', w: 700 });
        var cw = Math.min(56, Math.floor((W - 220) / Math.max(arr.length, 1)) - 8);
        arr.forEach(function (val, k) {
          var x = 130 + k * (cw + 8);
          var f = '#fff', st = C.grey, sw = 1.4;
          if (ci === k) { f = C.amberBg; st = C.amber; sw = 2.4; }
          out += h.rect(x, y, cw, 44, { fill: f, stroke: st, sw: sw, rx: 6 });
          out += h.txt(x + cw / 2, y + 27, String(val), { size: 15, w: 700 });
        });
        return out;
      }
      g += h.txt(W / 2, 34, '合并两个有序表（双指针归并）', { size: 18, w: 600 });
      g += row(66, 'LA', s.A, s.ai);
      g += row(134, 'LB', s.B, s.bi);
      g += h.txt(W / 2, 216, '↓ 每次取两表当前头部的较小者 ↓', { size: 13, fill: C.muted });
      g += row(238, 'LC', s.LC, -1);
      if (s.mark === 'final') {
        g += h.rect(W / 2 - 250, 330, 500, 54, { fill: C.greenBg, stroke: C.green, rx: 9 });
        g += h.txt(W / 2, 363, '✓ 有序合并完成，比较 ' + (s.LC.length - 1) + ' 次以内', { size: 15, w: 700, fill: C.green });
      }
      g += h.txt(W / 2, 430, '黄=该表当前比较位 ｜ 相等取 LA 保稳定 ｜ 一表用尽后另一表整体接上', { size: 12.5, fill: C.muted });
      g += h.txt(W / 2, 462, '这个过程就是归并排序每一层的 merge()——先在这里看懂，第 8 章就轻松了', { size: 12.5, fill: C.muted });
      return h.svg(W, H, g);
    }
  });
})();

/* 动画：双向链表与循环链表——双向插入四步/删除两步/循环遍历（教材 2.5） */
(function () {
  var DSC = window.DSC, h = DSC.h, C = DSC.C;

  var CODE_I = [
    's->prior = p->prior;        // ① 新结点 s 的 prior 指向 p 的前驱',

    'p->prior = s;               // ④ 最后才改 p 的 prior（顺序不能乱！）'
  ];
  var CODE_D = [
    'p->prior->next = p->next;   // ① 前驱跨过 p',
    'p->next->prior = p->prior;  // ② 后继跨过 p',

  ];

    id: 'dualList', ch: 2, name: '双向链表与循环链表',

    guide: [
      '双向链表每个结点两个指针：prior 指前驱、next 指后继——可以 O(1) 找到前驱，单链表不行',

      '删除只需两步"跨过 p"；对比单链表删除要额外维护前驱',

      { key: 'op', label: '场景', type: 'select', options: [
        ['ins', '双向插入：在 30 前插入 25'], ['del', '双向删除：删除 20'], ['cyc', '循环链表：从尾回到头']
      ], value: 'ins' }
    ],
    run: function (v) {

          line: Array.isArray(line) ? line : (line != null ? [line] : [1]), msg: msg,
          panel: { 链表: list.join(' ⇄ ') || '（空）' },

        });
      }
      if (v.op === 'ins') {
        var pos = 2;   // 在 list[2]=30 前插 25
        F('在结点 30 前插入 25：新结点 s 已创建，p 指向 30。', { cur: 30, s: 25, stage: 'start' });
        F('① s->prior = p->prior：先把 s 的前驱指针指向 20（记住它！）。', { cur: 30, s: 25, stage: 'step1' }, 0);
        F('② p->prior->next = s：前驱 20 的 next 改指 s。此时 20 ⇄ s 已连好，p 还挂在 s 后面。', { cur: 30, s: 25, stage: 'step2' }, 1);
        F('③ s->next = p：s 的 next 指向 30。', { cur: 30, s: 25, stage: 'step3' }, 2);
        list.splice(pos, 0, 25);
        F('④ p->prior = s：最后才改 30 的 prior。四步完成：10 ⇄ 20 ⇄ 25 ⇄ 30 ⇄ 40。', { cur: 30, s: 25, stage: 'done' }, 3, 3);
        F('若先执行④再执行①：p->prior 已被覆盖，前驱 20 的信息丢失——链直接断掉。这就是"先连后断"在双向链表里的版本。', { stage: 'warn' }, 'warn');
      } else if (v.op === 'del') {
        F('删除结点 20：双向链表不需要找前驱的"遍历"，p->prior 直接就是它。', { cur: 20, stage: 'start' });
        F('① p->prior->next = p->next：前驱 10 的 next 跨过 20，直接指向 30。', { cur: 20, stage: 'step1' }, 0);
        list.splice(1, 1);
        F('② p->next->prior = p->prior：后继 30 的 prior 跨过 20，指向 10。释放 p → 链表 10 ⇄ 30 ⇄ 40。', { cur: 30, stage: 'done' }, 1, 2);
        F('两步改链完成，O(1)——单链表要做到这件事得先遍历找前驱 O(n)。', { stage: 'ok' }, 'done');
      } else {

      }
      F(0, '双向链表以每个结点多一个 prior 指针的空间为代价，换来 O(1) 找前驱与对称的双向操作。', { mark: 'final' });
      return { code: v.op === 'del' ? CODE_D : CODE_I, frames: frames };
    },
    render: function (s) {
      var W = 980, H = 440;

        g += h.rect(x, y, cw, 50, { fill: isNew ? C.blueBg : del ? C.redBg : '#fff', stroke: isNew ? C.blue : del ? C.red : C.grey, sw: isNew || del ? 2.6 : 1.6, rx: 6 });
        g += h.txt(x + cw / 2, y + 30, String(list[i]), { size: 16, w: 700 });
        g += h.txt(x + cw / 2, y + 68, isNew ? '新结点 s' : '', { size: 10.5, fill: C.blue, w: 700 });

          g += h.txt(x1 + gap / 2, y + 10, 'next', { size: 9, fill: C.muted });

      if (s.op === 'cyc') {

        g += h.curve(xl, y + 25, xl + 40, y + 120, x0 + cw / 2, y + 60, { stroke: C.blue, sw: 2, dash: '5,4' });

      return h.svg(W, H, g);

      function v_opTitle() {

/* 动画：一元多项式相加（有序链表应用）——教材 2.8 案例，例题 A=7+3x+9x⁸+5x¹⁷，B=8x+22x⁷−9x⁸ */
(function () {
  var DSC = window.DSC, h = DSC.h, C = DSC.C;

  var CODE = [
    'void AddPolyn(Polynomial &Pa, Polynomial &Pb) {',
    '    // Pa、Pb 均按指数升序（有序链表）',
    '    while (pa && pb) {',
    '        if (pa->exp  <  pb->exp) { qa = pa; pa = pa->next; }        // A 项小：直接保留',
    '        else if (pa->exp == pb->exp) {                              // 指数相同：系数相加',
    '            sum = pa->coef + pb->coef;',
    '            if (sum != 0) { pa->coef = sum; qa = pa; }              // 和非零：并入 A',
    '            else { /* 删除 A 项 */ }  DelFirst(pb, pb); ++m;        // 和为零：两都删',
    '            pa = qa->next;  pb = pb->next;',
    '        }',
    '        else { /* B 项小：把 B 项插入 A */ }',
    '    }',
    '}'
  ];

  function parseTerms(s, name) {
    var toks = String(s).trim().split(/[\s;；,，]+/).filter(function (x) { return x !== ''; });
    if (toks.length % 2) throw Error(name + ' 格式应为「系数 指数 系数 指数 …」，如 7,0 3,1 9,8');
    var ts = [];
    for (var i = 0; i < toks.length; i += 2) {
      var c = Number(toks[i]), e = Number(toks[i + 1]);
      if (isNaN(c) || isNaN(e) || e < 0 || e > 30) throw Error(name + ' 系数/指数非法（指数 0~30）');
      ts.push({ c: c, e: e });
    }
    ts.sort(function (a, b) { return a.e - b.e; });
    for (var j = 1; j < ts.length; j++) if (ts[j].e === ts[j - 1].e) throw Error(name + ' 有重复指数 ' + ts[j].e);
    return ts;
  }
  function fmt(ts) {
    if (!ts.length) return '0';
    return ts.map(function (t, i) {
      var sign = t.c < 0 ? '−' : (i ? '+' : '');
      var a = Math.abs(t.c);
      var body = t.e === 0 ? String(a) : (a === 1 ? '' : a) + 'x' + (t.e > 1 ? 'ˆ' + t.e : '');
      return sign + (i && t.c > 0 ? ' ' : '') + body;
    }).join(' ');
  }

  var DEF_A = '7,0 3,1 9,8 5,17', DEF_B = '0,1 22,7 -9,8';

  DSC.reg({
    id: 'polyAdd', ch: 2, name: '一元多项式相加（有序链表）',
    note: '教材 2.8 案例分析与实现（指数升序合并、同类项合并）',
    guide: [
      '多项式按指数**升序**存进链表：相加就变成"两个有序表归并"——第2章 mergeList 的直接应用',
      '指数小的先输出；指数相同 → 系数相加，**和为 0 时两结点都删除**（观察 9x⁸ 与 −9x⁸）',
      '某表用尽后另一表整体接上；整个过程 O(m+n)',
      '可以自己改系数/指数（空格或逗号分隔的「系数,指数」对），看合并、抵消、接续三种情形'
    ],
    inputs: [
      { key: 'a', label: 'A(x)「系数,指数」对', type: 'text', value: DEF_A },
      { key: 'b', label: 'B(x)「系数,指数」对', type: 'text', value: DEF_B }
    ],
    run: function (v) {
      var A = parseTerms(v.a, 'A(x)'), B = parseTerms(v.b, 'B(x)');
      var frames = [], cmp = 0;
      var R = [];
      function F(line, msg, extra, mk) {
        extra = extra || {};
        frames.push({
          line: Array.isArray(line) ? line : [line], msg: msg,
          panel: { 比较: cmp + ' 次', 'A 剩': A.length + ' 项', 'B 剩': B.length + ' 项' },
          snap: { A: A.map(function (t) { return { c: t.c, e: t.e }; }), B: B.map(function (t) { return { c: t.c, e: t.e }; }), R: R.map(function (t) { return { c: t.c, e: t.e }; }), hiA: extra.hiA, hiB: extra.hiB, mark: mk }
        });
      }
      F(0, 'A(x) = ' + fmt(A) + '；B(x) = ' + fmt(B) + '。都按指数升序存放。', { hiA: 0, hiB: 0 });
      var i = 0, j = 0;
      while (i < A.length && j < B.length) {
        cmp++;
        if (A[i].e < B[j].e) { R.push(A[i]); F([3], 'A 指数 ' + A[i].e + ' < B 指数 ' + B[j].e + ' → A 的 ' + A[i].c + 'x^' + A[i].e + ' 直接并入结果。', { hiA: i, hiB: j }); i++; }
        else if (A[i].e === B[j].e) {
          var sum = A[i].c + B[j].c;
          if (sum !== 0) {
            R.push({ c: sum, e: A[i].e });
            F([4, 5, 6], '指数相同（' + A[i].e + '）：系数 ' + A[i].c + ' + (' + B[j].c + ') = ' + sum + ' ≠ 0 → 合并为一项 x^' + A[i].e + '。', { hiA: i, hiB: j });
          } else {
            F([6, 7], '指数相同（' + A[i].e + '）：系数 ' + A[i].c + ' + (' + B[j].c + ') = 0 → **两项同时删除**，结果中消失。', { hiA: i, hiB: j });
          }
          i++; j++;
        } else { R.push(B[j]); F([9], 'B 指数 ' + B[j].e + ' < A 指数 ' + A[i].e + ' → B 的 ' + B[j].c + 'x^' + B[j].e + ' 插入结果。', { hiA: i, hiB: j }); j++; }
      }
      while (i < A.length) { R.push(A[i]); F(0, 'B 已尽：A 剩余项 ' + A[i].c + 'x^' + A[i].e + ' 直接并入。', { hiA: i }); i++; }
      while (j < B.length) { R.push(B[j]); F(0, 'A 已尽：B 剩余项 ' + B[j].c + 'x^' + B[j].e + ' 直接并入。', { hiB: j }); j++; }
      F(0, 'A(x) + B(x) = ' + fmt(R) + '。多项式相加 = 有序表归并 + 同类项合并，O(m+n)。系数链表让"删除中间项"也不必搬动其他项。', { mark: 'final' });
      return { code: CODE, frames: frames };
    },
    render: function (s) {
      var W = 980, H = 520;
      var g = '';
      function polyRow(y, label, ts, hi, color) {
        var out = h.txt(50, y + 24, label, { size: 13.5, fill: C.muted, anchor: 'start', w: 700 });
        ts.forEach(function (t, k) {

          out += h.txt(x + 59, y + 25, t.c + 'x' + String(t.e).split('').map(function (d) { return '⁰¹²³⁴⁵⁶⁷⁸⁹'[+d] || d; }).join(''), { size: 14, w: 700, family: 'Consolas,monospace' });
        });
        if (!ts.length) out += h.txt(140, y + 25, '（空）', { size: 13, fill: C.muted, anchor: 'start' });
        return out;
      }
      g += h.txt(W / 2, 34, '一元多项式相加：指数升序链表归并', { size: 17, w: 600 });
      g += polyRow(66, 'A(x)', s.A, s.hiA, C.blue);
      g += polyRow(126, 'B(x)', s.B, s.hiB, C.green);
      g += h.txt(W / 2, 208, '↓ 指数小的先走；指数相同系数相加（和为 0 则两删） ↓', { size: 13, fill: C.muted });
      g += polyRow(230, '和', s.R, -1, C.green);
      if (s.mark === 'final') {
        g += h.rect(W / 2 - 260, 320, 520, 54, { fill: C.greenBg, stroke: C.green, rx: 9 });
        g += h.txt(W / 2, 353, '✓ 相加完成（同类项已合并）', { size: 15, w: 700, fill: C.green });
      }
      g += h.txt(W / 2, 440, '黄色 = 当前比较的两项 ｜ 观察例题中 9x⁸ 与 −9x⁸ 的"抵消删除"', { size: 12.5, fill: C.muted });
      g += h.txt(W / 2, 472, '这就是"用有序链表表示多项式"的意义：合并/删项都不搬数据', { size: 12.5, fill: C.muted });
      return h.svg(W, H, g);
    }
  });
})();

/* 动画3：顺序栈的进栈与出栈
 * 三个独立场景（可切换）：①进栈演示——连续进栈直到栈满上溢；②出栈演示——从满栈连续出栈直到下溢；
 * ③综合演练——完整生命周期。top 指向下一个可插入位置（与教材/PPT 约定一致）。 */
(function () {
  var DSC = window.DSC, h = DSC.h, C = DSC.C;
  var MAXSIZE = 6;

  var CODE = [
    '#define MAXSIZE 6                     // 演示用容量',
    'typedef struct {',
    '    SElemType *base, *top;             // 栈底指针、栈顶指针',
    '    int stacksize;',
    '} SqStack;',
    '',
    'Status Push(SqStack &S, SElemType e) {',
    '    if (S.top - S.base == S.stacksize) return ERROR;   // 栈满 → 上溢',
    '    *S.top++ = e;                     // e压入栈顶，top加1',
    '    return OK;',
    '}',
    '',
    'Status Pop(SqStack &S, SElemType &e) {',
    '    if (S.top == S.base) return ERROR;                 // 栈空 → 下溢',
    '    e = *--S.top;                     // top先减1，再取栈顶元素',
    '    return OK;',
    '}'
  ];

  var SCENE_LABEL = {
    push: ['场景：进栈演示（只进栈，直到上溢）', C.blue, C.blueBg],
    pop: ['场景：出栈演示（只出栈，直到下溢）', C.green, C.greenBg],
    life: ['场景：综合演练（进栈 → 上溢 → 出栈 → 下溢）', C.amber, C.amberBg]
  };

  DSC.reg({
    id: 'seqStack', ch: 3, name: '③ 顺序栈：进栈与出栈',
    note: '教材 3.3 栈的表示和操作的实现（栈空/栈满判定、上溢/下溢）',
    guide: [
      '场景①进栈：观察 *S.top++ 两步——先放元素、top 再加 1；栈满判定 top−base==stacksize',
      '场景②出栈：--S.top 后再取元素；栈空判定 top==base',
      '场景③生命周期：完整走一遍"建栈→用栈→销毁栈"，理解栈空间的动态分配',
      '每个操作前都有边界判断帧——上溢/下溢就是在这里被拦截的'
    ],
    inputs: [
      {
        key: 'scene', label: '演示场景', type: 'select', options: [
          ['push', '① 进栈演示：连续进栈 → 栈满上溢'],
          ['pop', '② 出栈演示：连续出栈 → 栈空下溢'],
          ['life', '③ 综合演练：完整生命周期（混合）']
        ], value: 'push'
      }
    ],
    run: function (v) {
      var scene = v.scene || 'push';
      var frames = [];
      var cells = [null, null, null, null, null, null], top = 0;
      function snap(o) {
        o = o || {};
        o.cells = cells.slice(); o.top = top; o.max = MAXSIZE; o.base = 0; o.scene = scene;
        return o;
      }
      function F(line, msg, panel, s) { frames.push({ line: Array.isArray(line) ? line : [line], msg: msg, panel: panel, snap: s }); }
      function len() { return top; }
      function basePanel(extra) {
        var p = { 场景: SCENE_LABEL[scene][0].replace('场景：', ''), 栈长: 'top − base = ' + len(), 栈顶元素: top > 0 ? cells[top - 1] : '—' };
        if (extra) for (var k in extra) p[k] = extra[k];
        return p;
      }

      if (scene === 'pop') {
        /* 出栈演示：先一次性进满，专注出栈 */
        for (var pf = 0; pf < MAXSIZE; pf++) cells[pf] = 'ABCDEFG'[pf];
        top = MAXSIZE;
        F([7, 12], '【出栈演示】为专注于出栈，先一次性把 A～F 六个元素压入栈（相当于连续执行 6 次 Push，中间步骤见"① 进栈演示"）。当前栈满：top − base = 6 == stacksize。',
          basePanel({ 进栈次序: 'A B C D E F（F 最后进，在栈顶）' }), snap({ note: 'prefill' }));
        var pops = [];
        for (var pi = 0; pi < MAXSIZE; pi++) {
          F(13, '出栈第 ' + (pi + 1) + ' 次：检查栈空？top = ' + top + ' ≠ base = 0，栈非空，可以出栈。',
            basePanel(), snap({ op: 'pop' }));
          F(14, '--S.top：top 先减 1 → ' + (top - 1) + '（栈顶元素还在下标 ' + (top - 1) + '，只是 top 不再指向"可插入位置"）。',
            { top: String(top - 1) }, snap({ lastIdx: top - 1, op: 'pop', stage: 'dec' }));
          top--;
          var ev = cells[top]; cells[top] = null; pops.push(ev);
          F(14, 'e = *S.top：取出栈顶元素 e = ' + ev + '，该格子腾空。最后进的 ' + ev + ' 最先出——后进先出（LIFO）。',
            basePanel({ 最近返回: 'e = ' + ev, 已出栈: pops.join(' ') }), snap({ lastIdx: top, ret: ev, op: 'pop' }));
        }
        F(13, '再出栈：检查 top == base，【栈空】！发生【下溢】(underflow)，返回 ERROR。栈里已经没有任何元素可取。',
          basePanel({ 结果: 'ERROR（下溢）' }), snap({ err: '下溢', op: 'pop' }));
        F([12, 13], '出栈演示结束。要点：① 栈空判定 top == base；② 下溢 = "空还出"；③ 出栈序列 F E D C B A 与进栈次序 A B C D E F 恰好相反——这就是 LIFO。出栈时间复杂度 O(1)。',
          { 出栈序列: pops.join(' '), 栈长: 'top − base = 0' }, snap({ done: true }));
        return { code: CODE, frames: frames };
      }

      /* 进栈演示 / 综合演练：从空栈开始 */
      F([0, 1, 2, 3, 4], scene === 'push'
        ? '【进栈演示】初始化空栈：base 指向栈底，top 也指向 base（约定：top 指向"下一个可插入位置"）。空栈标志：top == base。下面连续进栈，观察 top 与元素的配合。'
        : '【综合演练】初始化空栈：base 指向栈底，top 也指向 base。本场景按"进栈 → 栈满上溢 → 出栈 → 栈空下溢"完整走一遍。',
        basePanel({ 栈空判定: 'top == base  ✓成立', 栈满判定: 'top − base == stacksize' }),
        snap({ note: '空栈' }));

      var script = scene === 'push'
        ? [['push', 'A'], ['push', 'B'], ['push', 'C'], ['push', 'D'], ['push', 'E'], ['push', 'F'], ['push', 'G']]
        : [['push', 'A'], ['push', 'B'], ['push', 'C'], ['push', 'D'], ['push', 'E'], ['push', 'F'], ['pop'], ['push', 'G'], ['push', 'H'],
          ['pop'], ['pop'], ['pop'], ['pop'], ['pop'], ['pop'], ['pop']];
      var pushes = [], pops = [];
      script.forEach(function (op) {
        if (op[0] === 'push') {
          if (len() === MAXSIZE) {
            F(7, '进栈 ' + op[1] + '：检查 top − base = ' + len() + ' == stacksize = ' + MAXSIZE + '，栈已满！发生【上溢】(overflow)，返回 ERROR，' + op[1] + ' 无法入栈。',
              basePanel({ 结果: 'ERROR（上溢）', 进栈序列: pushes.join(' ') }), snap({ err: '上溢', op: 'push', arg: op[1] }));
            return;
          }
          F(7, '进栈 ' + op[1] + '：检查 top − base = ' + len() + ' < stacksize = ' + MAXSIZE + '，未满，可以入栈。',
            basePanel(), snap({ op: 'push', arg: op[1] }));
          cells[top] = op[1];
          F(8, '*S.top = ' + op[1] + '：第一步，把元素放进 top 当前指向的格子（下标 ' + top + '）——此时 top 还没有动。',
            { top: String(top), 该格子新值: op[1] }, snap({ lastIdx: top, op: 'push', arg: op[1], stage: 'assign' }));
          top++;
          pushes.push(op[1]);
          F(8, '第二步 S.top++：top 加 1 → ' + top + '，重新指向"下一个可插入位置"。栈长 = top − base = ' + len() + '。',
            basePanel(), snap({ lastIdx: top - 1, op: 'push', arg: op[1], stage: 'moved' }));
        } else {
          if (len() === 0) {
            F(13, '出栈：检查 top == base，【栈空】！发生【下溢】(underflow)，返回 ERROR。',
              basePanel({ 结果: 'ERROR（下溢）' }), snap({ err: '下溢', op: 'pop' }));
            return;
          }
          F(13, '出栈：检查 top == base？top = ' + top + ' ≠ base = 0，栈非空，可以出栈。',
            basePanel(), snap({ op: 'pop' }));
          F(14, '--S.top：top 先减 1 → ' + (top - 1) + '（栈顶元素还在下标 ' + (top - 1) + '，只是 top 不再指向"可插入位置"）。',
            { top: String(top - 1) }, snap({ lastIdx: top - 1, op: 'pop', stage: 'dec' }));
          top--;
          var e = cells[top]; cells[top] = null; pops.push(e);
          F(14, 'e = *S.top：取出栈顶元素 e = ' + e + '，该格子腾空。栈顶元素最先弹出——后进先出（LIFO）。',
            basePanel({ 最近返回: 'e = ' + e, 出栈序列: pops.join(' ') }), snap({ lastIdx: top, ret: e, op: 'pop' }));
        }
      });
      if (scene === 'push') {
        F([7, 8], '进栈演示结束。要点：① 每次进栈先判栈满（top − base == stacksize）；② *S.top++ 两步：先放元素、top 再加 1；③ 进栈序列 A B C D E F——后进者位置更高；④ 上溢 = "满还进"。进栈时间复杂度 O(1)。',
          { 进栈序列: pushes.join(' '), 栈长: 'top − base = ' + len() }, snap({ done: true }));
      } else {
        F([7, 13], '综合演练结束。要点：① 栈空 = top == base，栈满 = top − base == stacksize；② 上溢是"满还进"、下溢是"空还出"；③ 出栈序列 ' + pops.join(' ') + ' 与进栈次序相反（LIFO）。进栈/出栈时间复杂度均为 O(1)。',
          { 进栈序列: pushes.join(' '), 出栈序列: pops.join(' ') || '—', 栈长: 'top − base = ' + len() }, snap({ done: true }));
      }
      return { code: CODE, frames: frames };
    },
    render: function (s) {
      var W = 980, H = 470, cw = 96, ch = 64;
      var x0 = (W - MAXSIZE * cw) / 2, y0 = 190;
      var g = '';
      var sl = SCENE_LABEL[s.scene] || SCENE_LABEL.push;
      g += h.rect(30, 22, 330, 34, { fill: sl[2], stroke: sl[1], rx: 8 });
      g += h.txt(195, 44, sl[0], { size: 14.5, fill: sl[1], w: 600 });
      g += h.txt(W / 2 + 60, 44, '顺序栈（MAXSIZE = ' + s.max + '）', { size: 18, w: 600 });
      g += h.txt(W / 2, 108, '进栈 push：*S.top++ = e　｜　出栈 pop：e = *--S.top　｜　栈空：top == base　｜　栈满：top − base == stacksize',
        { size: 13.5, fill: C.muted });
      for (var k = 0; k < s.max; k++) {
        var x = x0 + k * cw;
        var fill = '#fff', stroke = C.grey, dash = null;

        if (s.lastIdx === k) {
          fill = s.op === 'pop' ? C.amberBg : C.greenBg;
          stroke = s.op === 'pop' ? C.amber : C.green;
        }
        if (s.err) { stroke = C.red; if (s.cells[k] === null) dash = '4,4'; }
        g += h.rect(x, y0, cw - 8, ch, { fill: fill, stroke: stroke, rx: 8, dash: dash, sw: s.lastIdx === k ? 2.5 : 1.5 });
        if (s.cells[k] !== null) g += h.txt(x + (cw - 8) / 2, y0 + ch / 2 + 7, s.cells[k], { size: 20, w: 700 });
        g += h.txt(x + (cw - 8) / 2, y0 + ch + 22, '下标 ' + k, { size: 12, fill: C.muted });
      }
      // base 指针
      var bx = x0 + (cw - 8) / 2;
      g += h.arrow(bx, y0 + ch + 52, bx, y0 + ch + 30, { stroke: C.muted, sw: 2 });
      g += h.txt(bx, y0 + ch + 74, 'base（栈底）', { size: 13, fill: C.muted });
      // top 指针
      var tx = x0 + s.top * cw + (cw - 8) / 2;
      var topCol = s.scene === 'pop' ? C.green : C.red;
      g += h.arrow(tx, y0 - 52, tx, y0 - 12, { stroke: topCol, sw: 2.5 });
      g += h.txt(tx, y0 - 62, 'top' + (s.scene !== 'pop' ? '（下一个入栈位置）' : ''), { size: 13, fill: topCol, w: 600 });
      // 返回值
      if (s.ret != null) {
        g += h.rect(W - 200, y0 - 10, 150, 46, { fill: C.amberBg, stroke: C.amber, rx: 8 });
        g += h.txt(W - 125, y0 + 19, 'e = ' + s.ret, { size: 17, fill: C.amber, w: 700, family: 'Consolas,monospace' });
      }
      var note = s.err === '上溢' ? '✗ 上溢 overflow：栈满（top − base == stacksize）还执行进栈'
        : s.err === '下溢' ? '✗ 下溢 underflow：栈空（top == base）还执行出栈'
        : s.done ? (s.scene === 'push' ? '进栈要点：先判满，再 *S.top++ = e；上溢 = 满还进'
          : s.scene === 'pop' ? '出栈要点：先判空，再 e = *--S.top；出栈序与进栈序相反（LIFO）'
            : '完整生命周期：进栈 → 上溢 → 出栈 → 下溢')
        : s.note === 'prefill' ? '预置满栈：A～F 已在栈中，F 在栈顶'
        : (s.op === 'push' ? (s.stage === 'assign' ? '进栈第 1 步：*S.top = e（元素入格，top 未动）' : '进栈第 2 步：S.top++（指针上移）')
          : s.op === 'pop' ? (s.stage === 'dec' ? '出栈第 1 步：--S.top（指针下移）' : '出栈第 2 步：e = *S.top（取值腾空）')
            : '初始空栈：top == base');
      var nc = s.err ? C.red : (s.done ? C.green : C.blue);
      g += h.rect(W / 2 - 310, H - 58, 620, 34, { fill: s.err ? C.redBg : (s.done ? C.greenBg : C.blueBg), stroke: nc, rx: 8 });
      g += h.txt(W / 2, H - 36, note, { size: 14, fill: nc, w: 600 });
      return h.svg(W, H, g);
    }
  });
})();


/* ==================== ch3/02circQueue.js ==================== */
/* 动画4：队列的入队与出队

      var fx = cx + (R + 88) * Math.cos(ang), fy = cy + (R + 88) * Math.sin(ang);
      var tx = P.x + (P.x - cx) / R * (bh / 2 + 12), ty = P.y + (P.y - cy) / R * (bh / 2 + 12);
      g += h.arrow(fx, fy, tx, ty, { stroke: col, sw: 2.5, head: 8 });
      var anchor = dx === 0 ? 'middle' : (dx < 0 ? 'end' : 'start');
      g += h.txt(fx + dx, fy + (fy > cy ? 20 : -8), name, { size: 15, fill: col, w: 700, family: 'Consolas,monospace', anchor: anchor });
    }
    ptrArr('front=' + s.front, s.front, C.green, -34);
    ptrArr('rear=' + s.rear, s.rear, C.blue, 10);
    var rx = 770;
    g += h.txt(rx + 95, 120, '判定条件', { size: 16, w: 600 });
    function condBox(y, txt, sub, col, bg) {
      g += h.rect(rx, y, 190, 46, { fill: bg, stroke: col, rx: 8 });
      g += h.txt(rx + 95, y + 19, txt, { size: 12.5, fill: col, w: 600 });
      g += h.txt(rx + 95, y + 37, sub, { size: 11.5, fill: C.muted });
    }
    var fullNow = s.scheme === 'fewer' ? ((s.rear + 1) % s.M === s.front)
      : s.scheme === 'size' ? (s.size === s.M) : (s.front === s.rear && s.tag === 1);
    var emptyNow = s.scheme === 'fewer' ? (s.front === s.rear)
      : s.scheme === 'size' ? (s.size === 0) : (s.front === s.rear && s.tag === 0);
    if (s.scheme === 'fewer') {
      condBox(140, '队空：front == rear', emptyNow ? '当前：成立 ✓（空）' : '当前：不成立', C.green, C.greenBg);
      condBox(196, '队满：(rear+1)%M == front', fullNow ? '当前：成立 ✓（满）' : '当前：不成立', C.blue, C.blueBg);
      g += h.rect(rx, 252, 190, 46, { fill: '#fff', stroke: C.grey, rx: 8 });
      g += h.txt(rx + 95, 270, '队长：(rear−front+M)%M', { size: 12 });
      g += h.txt(rx + 95, 288, '当前 = ' + s.length, { size: 13, w: 600 });
    } else if (s.scheme === 'size') {
      condBox(140, '队空：size == 0', emptyNow ? '当前：成立 ✓（空）' : '当前：不成立', C.green, C.greenBg);
      condBox(196, '队满：size == M', fullNow ? '当前：成立 ✓（满）' : '当前：不成立', C.blue, C.blueBg);
      g += h.rect(rx, 252, 190, 46, { fill: '#fff', stroke: C.grey, rx: 8 });
      g += h.txt(rx + 95, 270, '队长：size', { size: 12 });
      g += h.txt(rx + 95, 288, '当前 = ' + s.size + '（可存满 ' + s.M + ' 个）', { size: 12.5, w: 600 });
    } else {
      condBox(140, '队空：front==rear 且 tag=0', emptyNow ? '当前：成立 ✓（空）' : '当前：不成立', C.green, C.greenBg);
      condBox(196, '队满：front==rear 且 tag=1', fullNow ? '当前：成立 ✓（满）' : '当前：不成立', C.blue, C.blueBg);
      g += h.rect(rx, 252, 190, 46, { fill: '#fff', stroke: C.grey, rx: 8 });
      g += h.txt(rx + 95, 270, 'tag：最近操作（0出队/1入队）', { size: 11 });
      g += h.txt(rx + 95, 288, '当前 tag = ' + s.tag + '，队长 = ' + s.length, { size: 12.5, w: 600 });
    }
    g += h.txt(rx + 95, 330, 'front 指向队头元素', { size: 12.5, fill: C.green });
    g += h.txt(rx + 95, 352, 'rear 指向队尾的下一位置', { size: 12.5, fill: C.blue });
    var note = s.err === '上溢' ? '✗ 上溢：队满还入队'
      : s.err === '下溢' ? '✗ 下溢：队空还出队'
      : s.done ? '三种方案：少一单元（省变量）｜ size（直观，存满 M）｜ tag（开销最小，存满 M，即实验一(四)）'
      : s.note === 'init' ? '指针一律取模后移：rear=(rear+1)%M，front=(front+1)%M（假溢出已解决）'
      : '入队：判满→放元素→rear取模后移　｜　出队：判空→取元素→front取模后移';
    var nc = s.err ? C.red : C.blue;
    g += h.rect(W / 2 - 310, H - 50, 620, 34, { fill: s.err ? C.redBg : C.blueBg, stroke: nc, rx: 8 });
    g += h.txt(W / 2, H - 28, note, { size: 13.5, fill: nc, w: 600 });
    return h.svg(W, H, g);
  }
})();
