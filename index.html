/* 动画：分块查找（索引顺序查找）——教材 7.2，块间有序 / 块内无序，两段查找 */
(function () {
  var DSC = window.DSC, h = DSC.h, C = DSC.C;

  var CODE = [
    'int BlockSearch(SSTable ST, IndexTable ID, KeyType key) {',
    '    // ① 在索引表（有序）中确定所在块：可顺序也可折半',
    '    for (b = 1; b <= ID.len && ID[b].max < key; ++b);',
    '    if (b > ID.len)  return 0;                 // 比所有块上界都大 → 失败',
    '    // ② 在该块内顺序查找（块内无序，只能顺序）',
    '    for (i = ID[b].start; i < ID[b].start + ID[b].len; ++i)',
    '        if (ST.r[i].key == key)  return i;',
    '    return 0;',
    '}'
  ];

  var DEF = [22, 12, 13, 8, 9, 33, 42, 44, 38, 24, 48, 60, 58, 74, 49];

  DSC.reg({
    id: 'blockSearch', ch: 7, name: '分块查找（索引顺序查找）',
    note: '教材 7.2 分块查找（索引表定块、块内顺序，折中的 ASL）',
    guide: [
      '分块 = "块间有序、块内无序"：先查**索引表**（每块最大值，有序）确定所在块，再在块内顺序扫',
      '蓝色=索引表扫描，黄色=块内扫描；先看 key=38：索引 2 步定块，块内 2 步命中',
      'key=50：比前两块上界都大、落在第三块，但块内没有 → 失败（仍要扫完该块）',
      'ASL = 索引查找 + 块内查找，介于顺序查找 O(n) 与折半 O(log n) 之间；分块还支持"块内插入不移动其他块"'
    ],
    inputs: [
      { key: 'key', label: '查找 key', type: 'select', options: [['38', '38（成功：第 2 块）'], ['49', '49（成功：第 3 块）'], ['50', '50（失败）'], ['8', '8（成功：第 1 块）']], value: '38' },
      { key: 'im', label: '索引表查找方式', type: 'select', options: [['seq', '顺序'], ['bin', '折半']], value: 'seq' }
    ],
    run: function (v) {
      var st = DEF.slice(), n = st.length, B = 3, S = n / B;
      var key = +v.key;
      var idx = [];
      for (var b = 0; b < B; b++) {
        var mx = -1;
        for (var k = 0; k < S; k++) mx = Math.max(mx, st[b * S + k]);
        idx.push(mx);
      }
      var frames = [], cmp = 0;
      function F(line, msg, extra, mk) {
        extra = extra || {};
        frames.push({
          line: Array.isArray(line) ? line : [line], msg: msg,
          panel: { 比较: cmp + ' 次', 阶段: extra.phase || '—', 结果: extra.res || '查找中…' },
          snap: { st: st, idx: idx, S: S, B: B, key: key, curI: extra.curI, curB: extra.curB, blk: extra.blk, hit: extra.hit, res: extra.res || null, im: v.im, visit: (extra.visit || []).slice(), mark: mk }
        });
      }
      var visit = [];
      F(0, '原表 "块间有序、块内无序"：索引表 = 每块最大值 ' + idx.join('、') + '（有序）。查找 key=' + key + ' 分两段：先索引表定块，再块内顺序。', { phase: '索引表' });

      if (v.im === 'bin') {
        var lo = 0, hi = B - 1, blk = -1;
        while (lo <= hi) {
          var mid = Math.floor((lo + hi) / 2);
          cmp++; visit.push(mid);
          F(1, '折半查索引表：ID[' + (mid + 1) + '].max=' + idx[mid] + (idx[mid] >= key ? ' ≥ ' : ' < ') + key + (idx[mid] >= key ? ' → 块（或更左）' : ' → 右半') + '。', { phase: '索引表(折半)', curB: mid, visit: visit });
          if (idx[mid] >= key) { blk = mid; hi = mid - 1; } else lo = mid + 1;
        }
        if (blk < 0) { F(2, '索引表全部 < key：key 比所有块上界都大 → 查找失败。', { phase: '索引表', visit: visit, res: '失败：key 不在表中' }, 'fail'); return { code: CODE, frames: frames }; }
        F(1, '确定所在块：第 ' + (blk + 1) + ' 块（其上界 ' + idx[blk] + ' ≥ ' + key + '，且前一块上界 < key）。', { phase: '索引表', blk: blk, visit: visit });
      } else {
        var blk = -1;
        for (var b2 = 0; b2 < B; b2++) {
          cmp++; visit.push(b2);
          if (idx[b2] >= key) { blk = b2; F(1, '索引表第 ' + (b2 + 1) + ' 项：上界 ' + idx[b2] + ' ≥ key=' + key + ' → 目标只可能在第 ' + (b2 + 1) + ' 块。', { phase: '索引表', curB: b2, blk: blk, visit: visit }); break; }
          F(1, '索引表第 ' + (b2 + 1) + ' 项：上界 ' + idx[b2] + ' < key → 跳过第 ' + (b2 + 1) + ' 块。', { phase: '索引表', curB: b2, visit: visit });
        }
        if (blk < 0) { F(2, '所有块上界都 < key → 查找失败（只比较了 B=' + B + ' 次索引——这是分块的优点）。', { phase: '索引表', visit: visit, res: '失败：key 不在表中' }, 'fail'); return { code: CODE, frames: frames }; }
      }

      F(3, '进入第 ' + (blk + 1) + ' 块（位置 ' + (blk * S + 1) + '~' + ((blk + 1) * S) + '），块内无序 → 只能顺序扫描。', { phase: '块内', blk: blk, visit: visit });
      var hit = -1;
      for (var k2 = 0; k2 < S; k2++) {
        var p = blk * S + k2;
        cmp++;
        if (st[p] === key) { hit = p; F(5, 'ST[' + (p + 1) + ']=' + st[p] + ' = key，命中！共比较 ' + cmp + ' 次（索引 + 块内）。', { phase: '块内', blk: blk, curI: p, hit: p, res: '成功：第 ' + (p + 1) + ' 个元素' }, 'found'); break; }
        F(4, 'ST[' + (p + 1) + ']=' + st[p] + ' ≠ ' + key + '，继续。', { phase: '块内', blk: blk, curI: p, visit: visit });
      }
      if (hit < 0) F(5, '块内扫完没有命中 → 查找失败（key 不在表中，但绝不会出现在其他块）。', { phase: '块内', blk: blk, res: '失败：key 不在表中' }, 'fail');
      var aslIdx = v.im === 'bin' ? Math.ceil(Math.log2(B + 1)) : (B + 1) / 2;
      F(0, '小结：等概率下 ASL = 索引查找 + 块内查找。本例 3 块每块 5 个：顺序索引 + 顺序块内 = (' + (B + 1) + '/2)+(' + (S + 1) + '/2) = 5；若索引用折半 ≈ ' + (Math.ceil(Math.log2(B + 1)) + (S + 1) / 2).toFixed(1) + '。n 越大，分块相对整体顺序查找的优势越明显。', { res: hit >= 0 ? '成功' : '失败' });
      return { code: CODE, frames: frames };
    },
    render: function (s) {
      var W = 980, H = 520;
      var g = '';
      g += h.txt(W / 2, 30, '分块查找：key = ' + s.key + '（' + (s.im === 'bin' ? '索引折半' : '索引顺序') + '）', { size: 17, w: 600 });
      /* 索引表 */
      g += h.txt(60, 78, '索引表（有序）', { size: 13.5, fill: C.muted, anchor: 'start', w: 600 });
      var iw = 110, ix = 60;
      for (var b = 0; b < s.B; b++) {
        var on = s.curB === b || s.blk === b;
        var visited = s.visit && s.visit.indexOf(b) >= 0;
        var f = on ? C.blueBg : visited ? C.amberBg : '#fff', st2 = on ? C.blue : visited ? C.amber : C.grey;
        g += h.rect(ix + b * (iw + 10), 90, iw, 40, { fill: f, stroke: st2, sw: on ? 2.4 : 1.5, rx: 6 });
        g += h.txt(ix + b * (iw + 10) + iw / 2, 116, 'max=' + s.idx[b], { size: 14, w: 700 });
        g += h.txt(ix + b * (iw + 10) + iw / 2, 146, '第 ' + (b + 1) + ' 块', { size: 11, fill: C.muted });
      }
      /* 主表（按块分框） */
      var bw = 52, x0 = 60, y0 = 210;
      for (var b2 = 0; b2 < s.B; b2++) {
        var bx = x0 + b2 * (s.S * bw + 26);
        g += h.rect(bx - 8, y0 - 8, s.S * bw + 16, 66, { fill: s.blk === b2 ? C.blueBg : 'none', stroke: s.blk === b2 ? C.blue : C.line, sw: s.blk === b2 ? 2 : 1, rx: 8, dash: s.blk === b2 ? null : '4,4' });

          g += h.txt(x + (bw - 4) / 2, y0 + 66, String(p + 1), { size: 10, fill: C.muted });
        }
      }
      g += h.txt(60, 350, '块内无序（块间有序）：索引表只管"最大值上界"，块内必须顺序扫描', { size: 12.5, fill: C.muted, anchor: 'start' });
      if (s.res) g += h.txt(W / 2, 420, (s.res.indexOf('成功') >= 0 ? '✓ ' : '✗ ') + s.res, { size: 16, w: 700, fill: s.res.indexOf('成功') >= 0 ? C.green : C.red });
      g += h.txt(W / 2, 470, '索引表(有序) ─确定块→ 块内(无序) ─顺序扫→ 结果；ASL 介于顺序与折半之间', { size: 12.5, fill: C.muted });

/* 动画：二叉排序树 BST——教材 7.3，插入（路径比较）与删除三情形，例题 {45,24,53,12,37,90} */
(function () {
  var DSC = window.DSC, h = DSC.h, C = DSC.C;

  var CODE_I = [
    'BSTNode* InsertBST(BSTNode *T, KeyType key) {',
    '    if (!T)  return new BSTNode(key);         // 空位：创建新结点',
    '    if (key == T->key)      return T;         // 已存在（不重复插入）',
    '    else if (key < T->key)  T->lchild = InsertBST(T->lchild, key);   // 小 → 左',
    '    else                    T->rchild = InsertBST(T->rchild, key);   // 大 → 右',
    '    return T;',
    '}'
  ];
  var CODE_D = [
    'void DeleteBST(BSTNode *&T, KeyType key) {',
    '    if (!T) return;',
    '    if (key < T->key)  DeleteBST(T->lchild, key);      // 左子树找',
    '    else if (key > T->key) DeleteBST(T->rchild, key);  // 右子树找',
    '    else {                                             // 找到了，三种情形',
    '        if (!T->lchild)       T = T->rchild;           // ① 左空：右子树顶替',
    '        else if (!T->rchild)  T = T->lchild;           // ② 右空：左子树顶替',
    '        else {                                         // ③ 两孩子都在：',
    '            p = T->lchild;                             //   找中序前驱',
    '            while (p->rchild) p = p->rchild;',
    '            T->key = p->key;                           //   前驱值放入 T',
    '            DeleteBST(T->lchild, p->key);              //   再删除前驱结点',
    '        }',
    '    }',
    '}'
  ];

  function insert(node, val, path) {
    if (!node) { return { v: val, l: null, r: null, _new: true }; }
    path.push(node.v);
    if (val === node.v) return node;
    if (val < node.v) node.l = insert(node.l, val, path);
    else node.r = insert(node.r, val, path);
    return node;
  }
  function inorder(node, out) { if (!node) return; inorder(node.l, out); out.push(node.v); inorder(node.r, out); }
  function cloneT(n) { return n ? { v: n.v, l: cloneT(n.l), r: cloneT(n.r) } : null; }
  function find(node, val, path) { while (node) { path.push(node.v); if (val === node.v) return node; node = val < node.v ? node.l : node.r; } return null; }
  function maxNode(node) { while (node.r) node = node.r; return node; }

  var INS = [45, 24, 53, 12, 37, 90];

  DSC.reg({
    id: 'bst', ch: 7, name: '二叉排序树（插入与删除）',
    note: '教材 7.3 动态查找（中序有序、删除三情形）',
    guide: [
      '插入 = 一路比较走到空位：小于当前走左边、大于走右边——新结点永远是叶子',
      '中序遍历 BST 恰好得到递增序列（左侧演示），这是 BST 的灵魂性质',
      '删除有三种情形：叶子直接删；单孩子由孩子顶替；**双孩子用中序前驱（左子树最右）的值替换，再删前驱**',
      '试三个删除场景：删叶子 12、删单孩子 53、删双孩子 45——删根也能保持 BST 性质'
    ],
    inputs: [
      { key: 'op', label: '操作', type: 'select', options: [
        ['ins', '依次插入 45,24,53,12,37,90'],
        ['dl', '插入后删除叶子 12'],
        ['d1', '插入后删除单孩子结点 53'],
        ['d2', '插入后删除双孩子结点 45（前驱替代）']
      ], value: 'ins' }
    ],
    run: function (v) {
      var op = v.op;
      var root = null, frames = [], cmp = 0;
      var code = op === 'ins' ? CODE_I : CODE_D;

      function snap(hl) {
        hl = hl || {};
        return { tree: cloneT(root), cur: hl.cur || null, hit: hl.hit || null, del: hl.del || null, path: (hl.path || []).slice(), newv: hl.newv || null, note: hl.note || '', mark: hl.mark };
      }
      function F(line, msg, hl) {
        frames.push({
          line: Array.isArray(line) ? line : [line], msg: msg,
          panel: (function () { var io = []; inorder(root, io); return { 中序序列: io.join(' ≤ ') || '（空）', 结点数: String(io.length) }; })(),
          snap: snap(hl)
        });
      }

      INS.forEach(function (val) {
        var path = [];
        F(0, '插入 ' + val + '：从根开始比较。', {});
        var cur = root, parent = null, dir = '', dup = false;
        while (cur) {
          cmp++;
          if (val < cur.v) { F([3], val + ' < ' + cur.v + ' → 走左子树。', { cur: cur.v, path: path }); parent = cur; dir = 'l'; cur = cur.l; }
          else if (val > cur.v) { F([4], val + ' > ' + cur.v + ' → 走右子树。', { cur: cur.v, path: path }); parent = cur; dir = 'r'; cur = cur.r; }
          else { dup = true; F([2], val + ' 已存在（BST 不插重复键）。', { cur: cur.v }); break; }
        }
        if (dup) return;
        if (!root) { root = insert(root, val, path); }
        else if (dir === 'l') { parent.l = insert(null, val, []); } else if (dir === 'r') { parent.r = insert(null, val, []); }
        F(1, '走到空位：新结点 ' + val + ' 作为 ' + (parent ? parent.v + ' 的' + (dir === 'l' ? '左' : '右') + '孩子' : '根') + ' 插入——**插入永远发生在叶子层**，不需要调整树形。', { newv: val, hit: val }, 'ins' + val);

  });

/* 动画：直接插入排序（可切换折半插入）——教材 8.2，例题 {49,38,65,97,76,13,27,49*}，带哨兵 */
(function () {
  var DSC = window.DSC, h = DSC.h, C = DSC.C, su = DSC.su;

  var CODE = [
    'void InsertSort(SqList &L) {',
    '    for (i = 2; i <= L.length; ++i)',
    '        if (L.r[i] < L.r[i-1]) {              // 需将 L.r[i] 插入有序子表',
    '            L.r[0] = L.r[i];                  // 复制为哨兵',
    '            for (j = i-1; L.r[0] < L.r[j]; --j)',
    '                L.r[j+1] = L.r[j];            // 记录后移',
    '            L.r[j+1] = L.r[0];                // 插入到正确位置',
    '        }',
    '}'
  ];
  var CODE_B = [
    'void BInsertSort(SqList &L) {',
    '    for (i = 2; i <= L.length; ++i) {',
    '        L.r[0] = L.r[i];                      // 哨兵',
    '        low = 1;  high = i-1;                 // 在 [1..i-1] 中折半查找插入位置',
    '        while (low <= high) {',
    '            m = (low + high) / 2;',
    '            if (L.r[0] < L.r[m])  high = m-1; // 插入位置在低半区',
    '            else                  low  = m+1;',
    '        }                                     // 循环结束 low 即插入位置',
    '        for (j = i-1; j >= low; --j) L.r[j+1] = L.r[j];   // 记录后移',
    '        L.r[low] = L.r[0];',
    '    }',
    '}'
  ];

  DSC.reg({
    id: 'insertSort', ch: 8, name: '直接插入排序（含折半插入）',
    note: '教材 8.2 插入排序（逐个比较/后移/插入，稳定）',
    guide: [
      '左侧绿色为已排好的"有序区"，每趟把下一个元素插入其中',
      '观察哨兵 L.r[0]：先取出待插元素腾出空位，再从后往前比较、后移',
      '对比"直接/折半"两种方式：折半只减少比较次数，移动次数不变',
      '注意两个 49：直接插入排序是稳定的（相等元素不跨越）'
    ],
    inputs: su.presetInputs([
      { key: 'mode', label: '插入方式', type: 'select', options: [['d', '直接插入'], ['b', '折半插入']], value: 'd' }
    ]),
    run: function (v) {
      var a = su.getData(v);
      a.unshift(0);                                  // a[0] 为哨兵位
      var n = a.length - 1, bin = v.mode === 'b';
      var frames = [], cmp = 0, mov = 0;
      var code = bin ? CODE_B : CODE;

      function colors(hl) {
        var cs = [];
        for (var i = 1; i <= n; i++) cs.push(i <= (hl.done ? hl.done : 0) ? 'D' : 'N');
        if (hl.c) cs[hl.c - 1] = 'C';
        if (hl.s) cs[hl.s - 1] = 'S';
        if (hl.p) cs[hl.p - 1] = 'P';
        return cs;
      }
      function F(line, msg, extra, mk) {
        extra = extra || {};
        frames.push({
          line: Array.isArray(line) ? line : [line], msg: msg,
          panel: { 比较: cmp + ' 次', 移动: mov + ' 次', 有序区: '第 1 ~ ' + (extra.done || 0) + ' 个', 哨兵: extra.sent != null ? String(extra.sent) : '—' },
          snap: { arr: a.slice(1), colors: colors(extra), tags: [], sent: extra.sent, mark: mk }
        });
      }

      F(0, '初始序列（位置 1~' + n + '，a[0] 留作哨兵）。' + (bin ? '折半插入：先用二分找到插入位置，再统一后移。' : '直接插入：从后往前边比较边后移。'), { done: 0 });

      for (var i = 2; i <= n; i++) {
        var sent = a[i];
        if (!bin) {
          cmp++;
          if (a[i - 1] <= sent) { F(1, '第 ' + (i - 1) + ' 趟：a[' + i + ']=' + sent + ' ≥ 前驱 a[' + (i - 1) + ']=' + a[i - 1] + '，位置本就正确，本趟 0 次移动。', { c: i, done: i - 1, sent: sent }); }
          else {
            a[0] = a[i]; mov++;
            F([2, 3], '第 ' + (i - 1) + ' 趟：a[' + i + ']=' + sent + ' < 前驱，取出存入哨兵 a[0]，位置 ' + i + ' 腾空。', { p: i, sent: sent });
            var j = i - 1;
            while (a[0] < a[j]) {
              cmp++; a[j + 1] = a[j]; mov++;
              F(5, 'a[' + j + ']=' + a[j] + ' > 哨兵 ' + a[0] + ' → 后移到 a[' + (j + 1) + ']。', { c: j, s: j + 1, sent: a[0] });
              j--;
            }
            cmp++;
            a[j + 1] = a[0]; mov++;
            F(6, 'a[' + j + ']=' + (j >= 1 ? a[j] : '—') + ' ≤ 哨兵，停在这里：a[' + (j + 1) + '] = ' + a[0] + '，插入完成。', { s: j + 1, sent: a[0] });
          }
          F(1, '第 ' + (i - 1) + ' 趟完成：第 1~' + i + ' 个元素构成有序区。', { done: i, sent: null }, i);
        } else {
          a[0] = a[i]; mov++;
          F([1, 2], '第 ' + (i - 1) + ' 趟：取出 a[' + i + ']=' + sent + ' 存入哨兵，在有序区 [1..' + (i - 1) + '] 中折半查找插入位置。', { p: i, sent: sent });
          var low = 1, high = i - 1;
          while (low <= high) {
            var m = Math.floor((low + high) / 2);
            cmp++;
            var goLow = a[0] < a[m];
            F([5, 6, 7, 8], 'm=(1+' + high + ')/2 取中 m=' + m + '：a[m]=' + a[m] + (goLow ? ' > 哨兵 ' + a[0] + ' → 插入位置在低半区，high=' + (m - 1) : ' ≤ 哨兵 ' + a[0] + ' → 在高半区，low=' + (m + 1)) + '。',
              { c: m, p: i, sent: sent });
            if (goLow) high = m - 1; else low = m + 1;
          }
          F(4, '折半结束：low=' + low + ' ≤ high=' + high + ' 不再成立，插入位置确定为 low=' + low + '。', { sent: sent });
          for (var k = i - 1; k >= low; k--) { a[k + 1] = a[k]; mov++; F(9, 'a[' + k + ']=' + a[k] + ' 后移到 a[' + (k + 1) + ']。', { c: k, s: k + 1, sent: sent }); }
          a[low] = a[0]; mov++;
          F(10, 'a[' + low + '] = ' + a[0] + '，插入完成。', { s: low, sent: a[0] });
          F(2, '第 ' + (i - 1) + ' 趟完成：第 1~' + i + ' 个元素构成有序区。', { done: i, sent: null }, i);
        }
      }
      F(0, '排序完成：' + a.slice(1).join(' ') + '。共比较 ' + cmp + ' 次、移动 ' + mov + ' 次。要点：折半插入把比较次数降到 O(n log n)，但移动次数仍为 O(n²)——移动由序列初始排列决定，比较方式帮不上忙。',
        { done: n, sent: null }, 'final');
      return { code: code, frames: frames };
    },
    render: function (s) {
      var g = su.bars(s, { title: '插入排序（绿=有序区，蓝=待插元素，黄=比较，红=后移/写入）' });
      g += su.legend([['有序区', 'D'], ['取出/待插', 'P'], ['比较', 'C'], ['后移/写入', 'S']]);
      if (s.sent != null) g += h.txt(490, 446, '哨兵 a[0] = ' + s.sent, { size: 14, w: 700, fill: C.blue });
      return g;
    }
  });
})();

/* 动画：希尔排序——教材 8.3，增量序列 {4,2,1}，例题 {49,38,65,97,76,13,27,49*} */
(function () {
  var DSC = window.DSC, h = DSC.h, C = DSC.C, su = DSC.su;

  var CODE = [
    'void ShellSort(SqList &L, int dlta[]) {',
    '    // 增量序列 dlta = { 4, 2, 1 }',
    '    for (k = 0; k < 3; ++k)',
    '        ShellInsert(L, dlta[k]);          // 一趟增量为 dlta[k] 的插入排序',
    '}',
    'void ShellInsert(SqList &L, int dk) {',
    '    for (i = dk+1; i <= L.length; ++i)',
    '        if (L.r[i] < L.r[i-dk]) {         // 组内插入排序（带哨兵）',
    '            L.r[0] = L.r[i];',
    '            for (j = i-dk; j > 0 && L.r[0] < L.r[j]; j -= dk)',
    '                L.r[j+dk] = L.r[j];       // 组内记录后移 dk 位',
    '            L.r[j+dk] = L.r[0];',
    '        }',
    '}'
  ];

  DSC.reg({
    id: 'shellSort', ch: 8, name: '希尔排序（缩小增量）',
    note: '教材 8.3 希尔排序（分组插入、增量收缩，不稳定）',
    guide: [
      '按增量 dk 把序列分成 dk 组，组内做插入排序——远距离的元素先大致就位',
      '增量逐趟收缩（4→2→1），最后一趟 dk=1 就是普通直接插入，但此时序列已"基本有序"',
      '观察前几趟：移动步长是 dk 而不是 1，远处的小数能一步跳到前面',
      '希尔排序性能依赖增量序列，约 O(n^1.3)；相等的元素可能被分到不同组——它是不稳定排序'
    ],
    inputs: su.presetInputs(),
    run: function (v) {
      var a = su.getData(v);

/* ==================== ch8/04quickSort.js ==================== */
/* 动画：快速排序——教材 8.4，Partition 双指针相向扫描 + 递归树，例题 {49,38,65,97,76,13,27,49*} */
(function () {
  var DSC = window.DSC, h = DSC.h, C = DSC.C, su = DSC.su;

  var CODE = [
    'int Partition(SqList &L, int low, int high) {',
    '    L.r[0] = L.r[low];                        // 基准存入 L.r[0]，low 位腾空',
    '    pivotkey = L.r[low].key;',
    '    while (low < high) {',
    '        while (low < high && L.r[high] >= pivotkey) --high;',
    '        L.r[low] = L.r[high];                 // 小的换到左边',
    '        while (low < high && L.r[low]  <= pivotkey) ++low;',
    '        L.r[high] = L.r[low];                 // 大的换到右边',
    '    }',
    '    L.r[low] = L.r[0];                        // 基准归位：左边都不大于它，右边都不小于它',
    '    return low;',
    '}',
    'void QSort(SqList &L, int low, int high) {',
    '    if (low < high) { pivot = Partition(L, low, high);',
    '        QSort(L, low, pivot-1);  QSort(L, pivot+1, high); }',
    '}'
  ];

  DSC.reg({
    id: 'quickSort', ch: 8, name: '快速排序（Partition 划分）',
    note: '教材 8.4 交换排序（基准划分、分治递归，不稳定）',
    guide: [
      '每趟选区间第一个元素为基准（蓝色）：先挖出基准，左边留一个"坑"',
      'high 端从右向左找比基准小的填左坑；low 端从左向右找比基准大的填右坑——两指针相向而行',
      'low==high 时基准归位：它左边都不大于它、右边都不小于它，位置就是最终位置（绿色）',
      '对基准两侧子区间递归。切到"有序"数据看最坏情况：每次划分极度不平衡，退化为 O(n²)'
    ],
    inputs: su.presetInputs(),
    run: function (v) {
      var a = su.getData(v).slice();
      var n = a.length, cmp = 0, mov = 0;
      var frames = [], stackView = [];

      function colors(hl) {
        hl = hl || {};
        var cs = [];
        for (var i = 0; i < n; i++) cs.push('N');
        for (var k = 0; k < n; k++) if (a._done && a._done[k]) cs[k] = 'D';
        if (hl.c) cs[hl.c] = 'C';
        if (hl.s) cs[hl.s] = 'S';
        if (hl.p != null) cs[hl.p] = 'P';
        (hl.zone || []).forEach(function (i2) { if (cs[i2] === 'N') cs[i2] = 'P'; });
        return cs;
      }
      function F(line, msg, extra, mk) {
        extra = extra || {};
        frames.push({
          line: Array.isArray(line) ? line : [line], msg: msg,
          panel: { 比较: cmp + ' 次', 赋值: mov + ' 次', 调用栈: stackView.length ? stackView.join(' ｜ ') : '（空）' },
          snap: { arr: a.slice(), colors: colors(extra), mark: mk, zone: extra.zone || [] }
        });
      }

      F(0, '初始序列。快速排序 = 选基准 + Partition 划分 + 对两侧递归（分治）。', {});

      function qsort(low, high, depth) {
        if (low >= high) {
          if (low === high) { a._done = a._done || {}; a._done[low] = 1; }
          return;
        }
        stackView.push('[' + (low + 1) + '..' + (high + 1) + '] 基准=' + a[low]);
        F([13, 14, 15], 'QSort 处理区间 [' + (low + 1) + '..' + (high + 1) + ']：取基准 a[' + (low + 1) + ']=' + a[low] + ' 挖出，存入 L.r[0]。', { p: low, zone: [low, high] });
        var pivot = a[low];
        var i = low, j = high;
        while (i < j) {
          while (i < j && a[j] >= pivot) { cmp++; j--; }
          if (i < j) {
            cmp++;
            a[i] = a[j]; mov++;
            F([5, 6], '右端 a[' + (j + 1) + ']=' + a[j] + ' < 基准 ' + pivot + ' → 填入左坑 a[' + (i + 1) + ']，右端腾出新坑。', { c: j, s: i, p: low, zone: [low, high] });
          }
          while (i < j && a[i] <= pivot) { cmp++; i++; }
          if (i < j) {
            cmp++;
            a[j] = a[i]; mov++;
            F([7, 8], '左端 a[' + (i + 1) + ']=' + a[i] + ' > 基准 ' + pivot + ' → 填入右坑 a[' + (j + 1) + ']，左端腾出新坑。', { c: i, s: j, p: low, zone: [low, high] });
          }
        }
        a[i] = pivot; mov++;
        a._done = a._done || {}; a._done[i] = 1;
        F(10, '两指针相遇于 a[' + (i + 1) + ']：基准 ' + pivot + ' 归位（绿色）。左侧全部 ≤ ' + pivot + '，右侧全部 ≥ ' + pivot + '。', { s: i, zone: [low, high] }, 'part' + (low + 1) + '_' + (high + 1));
        stackView.pop();
        qsort(low, i - 1, depth + 1);
        qsort(i + 1, high, depth + 1);
      }
      qsort(0, n - 1, 1);
      F(12, '排序完成：' + a.join(' ') + '。要点：① 平均 O(n log n)，但**有序/逆序输入每次只能划分出 1 个元素**，退化为 O(n²)——这就是"快排怕有序"；② 相等元素会跨越基准，不稳定。', {}, 'final');
      return { code: CODE, frames: frames };
    },
    render: function (s) {
      var g = su.bars(s, { title: '快速排序（蓝=当前区间/基准，黄=扫描，红=填坑，绿=已归位）' });
      g += su.legend([['基准/区间', 'P'], ['扫描', 'C'], ['填坑', 'S'], ['已归位', 'D']]);
      return g;
    }
  });
})();

(function () {
  var DSC = window.DSC, h = DSC.h, C = DSC.C, su = DSC.su;

  var CODE = [
    'void HeapAdjust(SqList &L, int s, int m) {   // 使 a[s..m] 成为大根堆',
    '    rc = L.r[s];                             // 暂存待调整记录',

    '        if (rc >= L.r[j])  break;            // 找到归宿，结束',
    '        L.r[s] = L.r[j];  s = j;             // 孩子上移，继续向下',
    '    }',
    '    L.r[s] = rc;',
    '}',
    'void HeapSort(SqList &L) {',
    '    for (i = L.length/2; i >= 1; --i)        // ① 自下而上建大根堆',

    '    for (i = L.length; i > 1; --i) {         // ② 堆顶与堆尾交换，堆缩小',

    guide: [
      '上半部分是完全二叉树视图、下半部分是数组视图——同一份数据两种看法（a[i] 的孩子是 a[2i]、a[2i+1]）',
      '第一步自下而上"建堆"：从最后一个非叶结点开始，把大孩子逐层上移，让每个父亲 ≥ 孩子',
      '第二步反复"输出堆顶"：堆顶（最大值）与堆尾交换（绿色=已就位），堆缩小后再筛选重建',
      '建堆 O(n)，每次调整 O(log n)，整体 O(n log n)——不受初始序列影响，且只用到 O(1) 辅助空间'
    ],
    inputs: su.presetInputs(),
    run: function (v) {
      var a = su.getData(v).slice();
      var n = a.length, cmp = 0, mov = 0;
      a.unshift(0);
      var frames = [];

      function colors(hl, heap) {
        hl = hl || {}; heap = heap == null ? n : heap;
        var cs = [];
        for (var i = 1; i <= n; i++) cs.push(i > heap ? 'D' : 'N');
        if (hl.s != null && cs[hl.s - 1] === 'N') cs[hl.s - 1] = 'P';
        if (hl.c != null && cs[hl.c - 1] === 'N') cs[hl.c - 1] = 'C';
        if (hl.w != null) cs[hl.w - 1] = 'S';
        return cs;
      }
      function F(line, msg, extra, mk) {
        extra = extra || {};
        var heap = extra.heap == null ? n : extra.heap;
        frames.push({
          line: Array.isArray(line) ? line : [line], msg: msg,
          panel: { 比较: cmp + ' 次', 赋值: mov + ' 次', 堆区: 'a[1..' + heap + ']', 已输出: n - heap + ' 个' },
          snap: { arr: a.slice(1), colors: colors(extra, heap), heap: heap, s: extra.s, c: extra.c, w: extra.w, mark: mk }
        });
      }

      F(0, '初始序列（数组 a[1..' + n + ']，完全二叉树视图：a[i] 的孩子是 a[2i] 与 a[2i+1]）。先自下而上建大根堆。', {});

      function adjust(s, m, phase) {
        var rc = a[s];
        F([1], phase + '：调整结点 a[' + s + ']=' + rc + '（其子树中暂存于 rc）。', { s: s, heap: m });
        for (var j = 2 * s; j <= m; j *= 2) {
          if (j < m) {
            cmp++;
            if (a[j] < a[j + 1]) { F([3], '两个孩子 a[' + j + ']=' + a[j] + '、a[' + (j + 1) + ']=' + a[j + 1] + '：选较大者 a[' + (j + 1) + ']。', { c: j + 1, s: s, heap: m }); j++; }
            else { F([3], '两个孩子 a[' + j + ']=' + a[j] + '、a[' + (j + 1) + ']=' + a[j + 1] + '：选较大者 a[' + j + ']。', { c: j, s: s, heap: m }); }
          } else { F([3], '只有一个孩子 a[' + j + ']=' + a[j] + '。', { c: j, s: s, heap: m }); }
          cmp++;
          if (rc >= a[j]) { F([4], 'rc=' + rc + ' ≥ 大孩子 a[' + j + ']=' + a[j] + ' → 位置合适，筛选结束。', { s: s, c: j, heap: m }); break; }
          a[s] = a[j]; mov++;
          F(5, 'rc=' + rc + ' < 大孩子 a[' + j + ']=' + a[j] + ' → 大孩子上移到 a[' + s + ']，继续向下看。', { w: s, c: j, heap: m });
          s = j;
        }
        a[s] = rc; mov++;
        F(6, 'rc=' + rc + ' 放入最终位置 a[' + s + ']。', { w: s, heap: m });
      }

      for (var i = Math.floor(n / 2); i >= 1; i--) adjust(i, n, '建堆');
      F([9, 10], '建堆完成！a[1]=' + a[1] + ' 是全序列最大值，且每个父亲 ≥ 孩子。堆排序开始：反复"取堆顶 + 重建堆"。', {}, 'heap');

      var cnt = 0;
      for (var i2 = n; i2 > 1; i2--) {
        var t = a[1]; a[1] = a[i2]; a[i2] = t; mov++;
        cnt++;
        F(12, '第 ' + cnt + ' 步：堆顶 ' + t + ' 与堆尾 a[' + i2 + ']=' + a[i2] + ' 交换 → ' + t + ' 已就位（绿）。堆缩小为 a[1..' + (i2 - 1) + ']。',
          { w: i2, heap: i2 - 1 }, 'e' + cnt);
        adjust(1, i2 - 1, '重建堆');
      }
      F(12, '排序完成：' + a.slice(1).join(' ') + '。整个过程比较 ' + cmp + ' 次、赋值 ' + mov + ' 次。堆排序 = "树形选择排序"：利用父子关系把选择最小/最大的代价从 O(n) 降到 O(log n)。', { heap: 0 }, 'final');
      return { code: CODE, frames: frames };
    },
    render: function (s) {
      var W = 980, H = 620, n = s.arr.length, heap = s.heap == null ? n : s.heap;
      var g = '';
      g += h.txt(W / 2, 30, '堆排序（蓝=调整中，黄=孩子候选，红=写入，绿=已输出）', { size: 17, w: 600 });
      /* ---- 树视图 ---- */
      function pos(i) { // i 1-based
        var d = Math.floor(Math.log(i) / Math.LN2), k = i - (1 << d), cnt = 1 << d;
        var dx = Math.min(120, 880 / cnt);
        return [W / 2 + (k - (cnt - 1) / 2) * dx, 88 + d * 104];
      }
      for (var i = 1; i <= n; i++) {
        if (2 * i > n) continue;
        var A = pos(i), B1 = pos(2 * i);
        g += h.line(A[0], A[1] + 20, B1[0], B1[1] - 20, { stroke: C.line, sw: 1.6 });
        if (2 * i + 1 <= n) { var B2 = pos(2 * i + 1); g += h.line(A[0], A[1] + 20, B2[0], B2[1] - 20, { stroke: C.line, sw: 1.6 }); }
      }
      for (var i2 = 1; i2 <= n; i2++) {
        var P = pos(i2), key = s.colors[i2 - 1] || 'N';
        var cm = su.COLORS[key];
        var out = i2 > heap;
        g += h.circle(P[0], P[1], 21, { fill: out ? C.greenBg : cm[0], stroke: out ? C.green : cm[1], sw: out ? 1.6 : 2.2 });
        g += h.txt(P[0], P[1] + 6, String(s.arr[i2 - 1]), { size: 15, w: 700, fill: out ? C.green : C.ink });
        if (s.s === i2) g += h.txt(P[0], P[1] - 30, '调整中', { size: 11, fill: C.blue, w: 600 });
        if (s.c === i2) g += h.txt(P[0], P[1] - 30, '候选孩子', { size: 11, fill: C.amber, w: 600 });
      }
      /* ---- 数组视图 ---- */
      var bw = Math.min(60, Math.floor(880 / n) - 8), x0 = (W - n * bw - (n - 1) * 8) / 2, ay = 500;
      for (var i3 = 1; i3 <= n; i3++) {
        var x = x0 + (i3 - 1) * (bw + 8), key2 = s.colors[i3 - 1] || 'N', cm2 = su.COLORS[key2];
        var out2 = i3 > heap;
        g += h.rect(x, ay, bw, 40, { fill: out2 ? C.greenBg : cm2[0], stroke: out2 ? C.green : cm2[1], sw: 1.6, rx: 5 });
        g += h.txt(x + bw / 2, ay + 26, String(s.arr[i3 - 1]), { size: 15, w: 700, fill: out2 ? C.green : C.ink });
        g += h.txt(x + bw / 2, ay + 56, String(i3), { size: 10.5, fill: C.muted });
        if (i3 === 1 && heap >= 1) g += h.txt(x + bw / 2, ay - 10, '堆顶', { size: 11.5, fill: C.blue, w: 700 });
      }
      return h.svg(W, H, g);
    }
  });
})();

/* 动画：归并排序——教材 8.6，2 路归并（递归），例题 {49,38,65,97,76,13,27,49*} */
(function () {
  var DSC = window.DSC, h = DSC.h, C = DSC.C, su = DSC.su;

  var CODE = [
    'void Merge(SqList SR, SqList &TR, int s, int m, int t) {',
    '    // 将有序的 SR[s..m] 和 SR[m+1..t] 归并为有序的 TR[s..t]',
    '    for (i = s, j = m+1; i <= m && j <= t; ) {',
    '        if (SR[i] <= SR[j])  TR[k++] = SR[i++];   // 取左半（≤ 保稳定）',
    '        else                 TR[k++] = SR[j++];   // 取右半',
    '    }',
    '    while (i <= m) TR[k++] = SR[i++];             // 收尾：左半剩余',
    '    while (j <= t) TR[k++] = SR[j++];             // 收尾：右半剩余',
    '}',
    'void MSort(SqList SR, SqList &TR1, int s, int t) {',
    '    if (s == t)  TR1[s] = SR[s];',
    '    else { m = (s+t)/2;',
    '        MSort(SR, TR2, s, m);  MSort(SR, TR2, m+1, t);   // 递归两半',
    '        Merge(TR2, TR1, s, m, t); }                       // 归并',
    '}'
  ];

  DSC.reg({
    id: 'mergeSort', ch: 8, name: '归并排序（2 路归并）',
    note: '教材 8.6 归并排序（分治 + 两路合并，稳定）',
    guide: [
      '分治：把序列一分为二，两半分别排好序（左侧帧会显示当前处理的区间），再两路归并',
      '归并时两指针分别指向左右半区开头：每次取较小者写入结果（相等取左半——稳定）',
      '看最下面一层：单个元素天然有序，归并从最小单元自底向上长出有序序列',
      '一趟归并 O(n)，共 ⌈log n⌉ 趟，任何输入都是 O(n log n)；代价是需要 O(n) 辅助数组；它也是**外排序**的基础'
    ],
    inputs: su.presetInputs(),
    run: function (v) {
      var a = su.getData(v).slice();
      var n = a.length, cmp = 0, mov = 0;
      var frames = [];

      function colors(hl) {
        hl = hl || {};
        var cs = [];
        for (var i = 0; i < n; i++) cs.push('N');
        (hl.zl || []).forEach(function (i2) { cs[i2] = 'P'; });
        (hl.zr || []).forEach(function (i2) { if (cs[i2] === 'N') cs[i2] = 'N'; });
        if (hl.c1 != null) cs[hl.c1] = 'C';
        if (hl.c2 != null) cs[hl.c2] = 'C';
        if (hl.w != null) cs[hl.w] = 'S';
        (hl.done || []).forEach(function (i2) { cs[i2] = 'D'; });
        return cs;
      }
      function F(line, msg, extra, mk) {
        extra = extra || {};
        frames.push({
          line: Array.isArray(line) ? line : [line], msg: msg,
          panel: { 比较: cmp + ' 次', 写入: mov + ' 次', 当前区间: extra.range || '—' },
          snap: { arr: view.slice(), colors: colors(extra), mark: mk, range: extra.range }
        });
      }

      var work = a.slice(), view = a.slice();
      F(0, '初始序列。归并排序自顶向下二分，自底向上归并。', {});

      function msort(s, t) {           // 对 work[s..t] 排序（闭区间，0 基）
        if (s === t) return;
        var m = Math.floor((s + t) / 2);
        msort(s, m); msort(m + 1, t);
        var range = '[' + (s + 1) + '..' + (t + 1) + ']（左 [' + (s + 1) + '..' + (m + 1) + '] ＋ 右 [' + (m + 2) + '..' + (t + 1) + ']）';
        F(12, '开始归并区间 ' + range + '：两半各自已有序。', { zl: span(s, m), zr: span(m + 1, t), range: range });
        var i = s, j = m + 1, buf = [];
        while (i <= m && j <= t) {
          cmp++;
          if (work[i] <= work[j]) { buf.push(work[i]); F([3], '左半 a[' + (i + 1) + ']=' + work[i] + ' ≤ 右半 a[' + (j + 1) + ']=' + work[j] + ' → 取左。', { c1: i, c2: j, zl: span(s, m), zr: span(m + 1, t), range: range }); i++; }
          else { buf.push(work[j]); F([4], '左半 a[' + (i + 1) + ']=' + work[i] + ' > 右半 a[' + (j + 1) + ']=' + work[j] + ' → 取右。', { c1: i, c2: j, zl: span(s, m), zr: span(m + 1, t), range: range }); j++; }
          mov++;
        }
        while (i <= m) { buf.push(work[i]); mov++; i++; }
        while (j <= t) { buf.push(work[j]); mov++; j++; }
        for (var k2 = 0; k2 < buf.length; k2++) work[s + k2] = buf[k2];
        view = work.slice();
        F([5, 6, 7], '归并完成：区间 ' + range + ' 已整体有序：' + buf.join(' ') + '。', { zl: span(s, m), zr: span(m + 1, t), range: range, done: span(s, t) }, 'm' + s + '_' + t);
      }
      function span(s, t) { var r = []; for (var x = s; x <= t; x++) r.push(x); return r; }

      msort(0, n - 1);
      view = work.slice();
      F(15, '排序完成：' + view.join(' ') + '。n 个元素共归并 ⌈log₂n⌉ 层、每层 O(n)，任何输入都稳定在 O(n log n)；相等时优先取左半保证稳定。空间代价 O(n) 是它的短板——但这个"有序段合并"思想让归并成为磁盘外排序的基石。', {}, 'final');
      return { code: CODE, frames: frames };
    },
    render: function (s) {
      var g = su.bars(s, { title: '归并排序（蓝=左半区，黄=左右指针比较，红=写入，绿=该区间已有序）' });
      g += su.legend([['左半区', 'P'], ['比较指针', 'C'], ['写入', 'S'], ['已有序', 'D']]);
      return g;
    }
  });
})();

/* 动画：基数排序——教材 8.7，多关键字 LSD 分配/收集，教材例题 {278,109,063,930,589,184,505,269,008,083} */
(function () {
  var DSC = window.DSC, h = DSC.h, C = DSC.C, su = DSC.su;

  var CODE = [
    'void RadixSort(SqList &L) {',
    '    // 关键字按"个位→十位→百位"分解（LSD 最低位优先），每位取值 0..9',
    '    for (d = 1; d <= 3; ++d) {',
    '        // ① 分配：按第 d 位关键字，把记录放入队列 Q[0..9]',
    '        for (i = 1; i <= L.length; ++i)',
    '            EnQueue(Q[第d位(L.r[i])], L.r[i]);',
    '        // ② 收集：按 Q[0]..Q[9] 顺序依次出队接回',
    '        for (j = 0, i = 1; j <= 9; ++j)',
    '            while (!QueueEmpty(Q[j]))  L.r[i++] = DeQueue(Q[j]);',
    '    }',
    '}'
  ];

  var DEF = [278, 109, 63, 930, 589, 184, 505, 269, 8, 83];
  function pad3(x) { return ('00' + x).slice(-3); }

  DSC.reg({
    id: 'radixSort', ch: 8, name: '基数排序（分配与收集）',
    note: '教材 8.7 多关键字排序（LSD 最低位优先，稳定）',
    guide: [
      '基数排序不比较元素大小！把整数按位分解：个位→十位→百位，逐位做"分配 + 收集"',
      '分配：按当前位数字 0~9 把记录放进 10 个队列（黄色框显示当前入队记录）',
      '收集：按 Q[0]→Q[9] 依次出队接回原表。注意队列先进先出——这是稳定性的来源',
      '做完最高位后整体有序；趟数 = 最大位数 d，复杂度 O(d(n+10))，与 n 成线性关系'
    ],
    inputs: [
      { key: 'preset', label: '数据', type: 'select', options: [
        ['textbook', '教材例题 278,109,063,930,589,184,505,269,008,083'],
        ['custom', '自定义 ↓']
      ], value: 'textbook' },
      { key: 'w', label: '自定义序列', type: 'text', value: '278,109,63,930,589,184,505,269,8,83' }
    ],
    run: function (v) {
      var arr = v.preset === 'custom' ? su.parse(v.w) : DEF.slice();
      if (arr.length < 2 || arr.length > 10) throw Error('请输入 2~10 个非负整数');
      for (var c0 = 0; c0 < arr.length; c0++) if (arr[c0] < 0 || arr[c0] > 999) throw Error('数值需在 0~999 之间');
      var n = arr.length, d = 3;
      var frames = [], disp = arr.map(pad3);

      function F(line, msg, extra, mk) {
        extra = extra || {};
        frames.push({
          line: Array.isArray(line) ? line : [line], msg: msg,
          panel: { 趟数: extra.pass ? '第 ' + extra.pass + ' 趟（' + extra.bitName + '）' : '—', 队列: extra.buckets ? extra.buckets.map(function (b) { return b.length; }).join(',') : '—' },
          snap: { arr: (extra.arr || disp).slice(), colors: [], buckets: extra.buckets ? extra.buckets.map(function (b) { return b.slice(); }) : null, cur: extra.cur, mark: mk, pass: extra.pass }
        });
      }

      F(0, '初始序列（显示为 3 位对齐：如 008）。从最低位（个位）开始，逐位分配 + 收集。', {});

      var work = arr.slice();
      [1, 2, 3].forEach(function (bit) {
        var bitName = bit === 1 ? '个位' : bit === 2 ? '十位' : '百位';
        var buckets = [];
        for (var b = 0; b < 10; b++) buckets.push([]);
        F([2, 3], '【第 ' + bit + ' 趟 · ' + bitName + '】准备 10 个空队列 Q[0..9]，开始按 ' + bitName + '数字分配。', { arr: disp, pass: bit, bitName: bitName, buckets: buckets });
        for (var i = 0; i < n; i++) {
          var dig = Math.floor(work[i] / Math.pow(10, bit - 1)) % 10;
          buckets[dig].push(work[i]);
          F(4, pad3(work[i]) + ' 的 ' + bitName + ' = ' + dig + ' → 进入队列 Q[' + dig + ']。', { arr: disp, pass: bit, bitName: bitName, buckets: buckets, cur: i });
        }
        var out = [];
        for (var q = 0; q < 10; q++) while (buckets[q].length) out.push(buckets[q].shift());
        F([6, 7], '分配完毕，按 Q[0]→Q[9] 依次收集（队列先进先出，等值记录先后次序不变——稳定）。', { pass: bit, bitName: bitName, buckets: buckets.map(function () { return []; }) });
        work = out;
        disp = work.map(pad3);
        F([5, 8], '第 ' + bit + ' 趟收集完成：' + disp.join(' ') + '。' + (bit < 3 ? '注意观察：' + bitName + '小的都排到了前面。' : '百位也有序了——整体有序！'),
          { pass: bit, bitName: bitName, buckets: null }, 'p' + bit);
      });
      F(0, '排序完成：' + disp.join(' ') + '。共 3 趟（= 最大位数 d），每趟 n 次分配 + n 次收集，O(d·(n+r))，r 为基数。不比较、不交换，靠"位"的先后关系排序；d 与 r 固定时接近线性。', { arr: disp }, 'final');
      return { code: CODE, frames: frames };
    },
    render: function (s) {
      var W = 980, H = 520, n = s.arr.length;
      var bw = Math.min(70, Math.floor((W - 120) / n) - 10), gap = 10;
      var x0 = (W - (n * bw + (n - 1) * gap)) / 2, base = 200;
      var g = '';

      for (var i = 0; i < n; i++) {
        var x = x0 + i * (bw + gap);
        var hl = s.cur === i;
        g += h.rect(x, base, bw, 44, { fill: hl ? C.amberBg : '#fff', stroke: hl ? C.amber : C.grey, sw: hl ? 2.5 : 1.5, rx: 6 });
        g += h.txt(x + bw / 2, base + 27, s.arr[i], { size: 15.5, w: 700, family: 'Consolas,monospace' });
      }
      if (s.buckets) {
        g += h.txt(30, 320, '队列（Q0 → Q9）：', { size: 13.5, fill: C.muted, anchor: 'start', w: 600 });
        var qy = 336, qw = (W - 60) / 10;
        for (var q = 0; q < 10; q++) {
          var qx = 30 + q * qw;
          g += h.txt(qx + qw / 2, qy + 14, 'Q' + q, { size: 12, w: 700, fill: C.muted });
          g += h.rect(qx + 4, qy + 22, qw - 8, 116, { fill: '#fbfcfe', stroke: C.line, rx: 6 });
          s.buckets[q].forEach(function (val, k) {
            g += h.rect(qx + 10, qy + 30 + k * 36, qw - 20, 30, { fill: C.blueBg, stroke: C.blue, rx: 5 });
            g += h.txt(qx + qw / 2, qy + 50 + k * 36, pad3(val), { size: 12.5, w: 600, family: 'Consolas,monospace' });
          });
        }
      } else {
        g += h.txt(W / 2, 330, '（本帧队列为空——收集阶段/初始）', { size: 12.5, fill: C.muted });
      }
      g += h.txt(W / 2, H - 14, '分配：按当前位数字进队 ｜ 收集：按 Q0→Q9 出队接回。队列先进先出 ⇒ 稳定', { size: 12.5, fill: C.muted });
      return h.svg(W, H, g);
    }
  });
})();

})();
