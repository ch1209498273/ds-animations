    <div id="stage"></div>
    <div class="controls">
      <div id="inputs" class="inputs"></div>
      <button id="btnReset">⟲ 重置</button>
      <button id="btnPrev">◀ 上一步</button>
      <button id="btnNext">下一步 ▶</button>
      <button id="btnPlay">▶ 自动播放</button>

      <button id="btnLink" title="复制当前页面链接（可直达本模块本帧）">🔗 链接</button>
      <button id="btnGuide" title="显示/隐藏使用引导">? 引导</button>
      <label class="inp">速度
        <select id="speed">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
      </label>
      <input type="range" id="seek" min="0" max="0" value="0" title="拖动跳转到任意一步">
      <span id="pos" class="pos"></span>
    </div>
  </section>
  <aside class="side">
    <div class="sidehead">教材伪代码（当前执行行高亮）</div>
    <div class="codebox"><pre id="code"></pre></div>
    <div class="sidehead">状态面板</div>
    <table class="panel" id="panel"></table>
    <div id="msg" class="msg"></div>
  </aside>
</main>
