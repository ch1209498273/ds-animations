<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="__DESC__">
<meta property="og:type" content="website">
<meta property="og:title" content="__OGTITLE__">
<meta property="og:description" content="覆盖《数据结构（C语言版）》全部 8 章核心算法，教材例题逐帧对拍，在线点开即用，也可下载离线使用。">
<meta property="og:url" content="https://ch1209498273.github.io/ds-animations/">
<meta property="og:image" content="https://ch1209498273.github.io/ds-animations/assets/banner.png">
<title>《数据结构》互动课件</title>
<style>/*__CSS__*/</style>
</head>
<body>
<header class="top">
  <h1>《数据结构》互动课件</h1>
  <span class="sub">教材：《数据结构（C语言版）第3版》（严蔚敏 · 李冬梅 · 吴伟民） ｜ <span id="hintKeys">操作：← → 单步 ｜ 空格 播放/暂停 ｜ ☰ 打开目录</span></span>
  <span class="hbtns">
    <button id="btnCatalog" title="按章节浏览全部动画，一键直达或复制链接">☰ 目录</button>
    <button id="btnProj" title="投影模式：放大画面文字、收起导航条，适合课堂投屏">🖥 投影</button>
    <button id="btnPresent" title="放映模式：全屏投放，保留翻页/播放/缩放/进度条；⋯ 展开完整操作台，Esc 退出">⛶ 放映</button>
  </span>
  <span class="ver">__BUILD__</span>
</header>
<nav class="chapters" id="chapters"></nav>
<div class="modbar" id="modbar"></div>
<main>
  <section class="card">
    <div class="modtitle"><b id="modname"></b><span id="modnote2" class="modnote"></span><button id="mpExit" class="mponly">✕ 退出放映</button></div>
    <div id="guide" class="guidebox" hidden></div>
    <div id="stage"><div id="canvas"></div></div>
    <button id="mpPrev" class="mp-arrow prev" aria-label="上一步">‹</button>
    <button id="mpNext" class="mp-arrow next" aria-label="下一步">›</button>
    <div id="mpBar"><div id="mpMsg"></div><span id="mpCounter"></span></div>
    <div id="mpHintBar" hidden>↕ 画面比屏幕高，上下拖动可看其余部分</div>
    <div class="controls">
      <div id="inputs" class="inputs hideable"></div>
      <button id="btnReset" class="hideable">⟲ 重置</button>
      <button id="btnPrev">◀ 上一步</button>
      <button id="btnNext">下一步 ▶</button>
      <button id="btnPlay">▶ 自动播放</button>
      <button id="btnShot" class="hideable" title="把当前画面导出为 PNG 图片（可插入课件/试卷）">📷 截图</button>
      <button id="btnLink" class="hideable" title="复制当前页面链接（可直达本模块本帧）">🔗 链接</button>
      <button id="btnGuide" class="hideable" title="显示/隐藏使用引导">? 引导</button>
      <button id="btnMore" title="展开/收起完整操作台（输入项、重置、截图、链接、引导）">⋯ 更多</button>
      <label class="inp hideable">速度
        <select id="speed" title="1×≈1.1~2.2 秒/帧（随解说长度微调）；想更慢选 0.5×，逐帧讲用「下一步」">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
      </label>
      <span class="zoomgrp" role="group" aria-label="画面缩放">
        <button id="btnZoomOut" title="缩小画面（Ctrl+滚轮）">－</button>
        <span id="zoomLv" class="pos" aria-live="off">100%</span>
        <button id="btnZoomIn" title="放大画面（Ctrl+滚轮）">＋</button>
        <button id="btnZoomFit" title="恢复适配窗口">⤢ 适配</button>
      </span>
      <input type="range" id="seek" min="0" max="0" value="0" title="拖动跳转到任意一步" aria-label="播放进度">
      <span id="pos" class="pos" aria-live="polite"></span>
      <span id="pace" class="pos" title="本帧建议停留时长，随解说字数自适应" aria-live="off"></span>
    </div>
  </section>
  <aside class="side">
    <div class="sidehead">教材伪代码（当前执行行高亮）</div>
    <div class="codebox"><pre id="code"></pre></div>
    <div class="sidehead">状态面板</div>
    <table class="panel" id="panel"></table>
    <div id="msg" class="msg" aria-live="polite"></div>
  </aside>
</main>
<script>
//__CORE__
</script>
<script>
//__MODULES__
</script>

</body>
</html>
